# Framework-driven NPT water-box MD with LAMMPS
# (csvr thermostat, berendsen barostat)
# Topology: Dispatcher local / Workflow single / Calculator local
# Run: pyrai3md md_lammps_npt_csvr_berendsen.yaml
#
# 60 atoms = 20 TIP3P waters in the relaxed cubic cell declared below;
# the atom order matches the shared h2o.data topology fixture shipped
# in this directory (h2o.data / h2o.in.init / h2o.in.settings;
# qualification additionally stages project-renamed copies into the
# run directory). Geometry and momenta are the final frame of a LAMMPS
# ff_npt equilibration (refresh with tools/refresh_water_fixture.py),
# so an example no longer spends its first 20 fs shedding the strain
# of an ad-hoc placement.
# The framework velocity-Verlet integrator
# applies the csvr thermostat and the berendsen barostat; LAMMPS only provides
# energy/gradient/stress per step (ff_gradient). 2 ps run: the box starts
# from the equilibrated snapshot below and records 21
# frames (direct 1, buffer 100). No SHAKE constraint: the framework
# integrator moves the atoms, so declare one in the constraint block
# instead of in the LAMMPS input; at 1 fs the unconstrained O-H stretch
# (period ~14 fs for k=450 kcal/mol/A^2) stays resolved.

# barostat_tau stays 1000 fs. Unlike the parrinello-rahman and mttk
# examples this one finishes 2000 steps with its box within 16% of where it
# started, because weak coupling is a contraction with no cell momentum to
# accumulate: it cannot integrate a stress noise into a permanent shape
# drift. Raising tau_p here would only slow a barostat that is working. What
# this example does show is its temperature leaving 300 K (T_inst up to
# 830 K) while the volume is nearly right: the cell does work on the
# particles and the thermostat is left to remove it. The qualification
# reports that as a note instead of failing it
# (qualification/runner.py BOX_TOLERANCES, dev/methods/
# ENSEMBLE_DEVELOPMENT.md section 8.11).
control:
  title: md_lammps_npt_csvr_berendsen_example
  jobtype: md
  theory: [lammps]

  # Test switch. A cell that leaves its own starting size interrupts this
  # run instead of continuing; without it the same bound is only reported.
  # Qualification wants the interruption, a production run does not.
  debug: true

atoms: [O, H, H, O, H, H, O, H, H, O, H, H,
