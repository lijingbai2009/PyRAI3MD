# The zero-pressure twin of the shape-preserving pressure leg: this box with no
# load on it, which is the only thing ask 2 of `_check_cell_pressure` can compare
# a loaded drift against.
#
# Run: pyrai3md optimize_cell_iso.yaml
#
# `optimize_cell_pressure.yaml` asks a box to hold a pressure; whether the load
# points the right way is not readable from that run alone, because this box
# starts more compressed than 1 kbar and so rests at a LARGER volume than the one
# it is handed (#391, from round `tmp_20261018_200317`: |sigma| = 1688.1 bar at the
# end of its own unloaded relaxation). The pairing half of the clause therefore
# looks for the same box relaxing freely in the same round. Until this file the
# anisotropic side had that reference - `optimize_cell_aniso`, and the round
# printed `paired against optimize_cell_aniso, which drifted 17.087668 A^3
# unloaded: this leg drifted 15.730721 A^3 under 1000.0 bar` for it - and the
# isotropic side had nothing, so the loaded isotropic leg said `paired against
# nothing` and its direction rested on the residual coming down alone.
#
# Identity with the pressure leg is four declared items and one measurement: the
# same engine list (`[xtb]`), the same optimizer (`minima`), the same coupling
# (`isotropic`), the same starting volume (10.5 A cube, 1157.625 A^3), and
# `opt_pressure` absent. Those are exactly what
# `runner.py::_natural_motion_of_the_same_box` matches on, and a twin on a
# different engine list is refused on purpose: an unloaded drift is a property of
# the scoring function, so a cp2k arm of this same YAML would not be what this
# box does freely.
#
# What this case has to show, and what it would mean if it did not. Under
# isotropic coupling the lattice half of a step is confined to the single
# direction that scales the three row lengths together
# (`optimizer/base.py::_cell_direction`, :757-780), so their RATIOS cannot move
# and the `[COUPLING]` verdict (`runner.py::_check_cell_shape`) expects
# `shape_ratio_change` under `CELL_SHAPE_FLOOR` = 1e-5 - the two isotropic legs of
# round 16 and 17 read it as an exact 0.0. A run of this file whose ratios moved
# would not be a loose relaxation: it would be the projection missing from the
# step, the same defect `optimize_cell_pressure_aniso.yaml` looks for from the
# other side. The volume still has to move (`drift > 0`), or the box was relaxed
# against nothing at all.
#
# The system is the carrier #382/#388/#389 built for the pressure pair, copied
# byte for byte: one ethylene inside 25 waters in a 10.5 A cube, 81 atoms, Packmol
# 21.2.1 with a 2.3 A intermolecular exclusion, 26 connected components under this
# package's own periodic perception, closest intermolecular contact 2.518 A,
# density 0.654 g/cm3. It declares no `opt_cs*` pair because nothing here is
# judged against one: an unloaded box is judged on the machinery and on being a
# reference, and its thresholds are the schema defaults.
#
# Cost is NOT measured on this environment: xtb is not installed here. Round
# `tmp_20261019_122659` is the first reading of an unloaded isotropic drift, and
# it is the number ask 2 was written to need: volume 1157.625 -> 1175.2393 A^3,
# a drift of 17.614350 A^3, with the residual |sigma| falling 12518.074 ->
# 285.271 bar over the same five steps and `Converged: False` at the last one.
# The pressure leg it pairs with drifted 15.195667 A^3 under 1700.0 bar, so the
# load took 2.418683 A^3 off this motion and the clause read pass on both legs.
# That round also retires the caveat the same paragraph used to carry about the
# load: 1700 bar was still an extrapolation from the 1688.1 bar above when the
# two files were written, and the pair of readings now in this file is what
# running it produced - the extrapolation pointed the right way, and neither leg
# stopped on the rest point, which is why asks 3 and 4 are printed and not
# judged.

control:
  title: optimize_cell_iso_example
  jobtype: optimize
  theory: [xtb]

atoms: [C, C, H, H, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H]
