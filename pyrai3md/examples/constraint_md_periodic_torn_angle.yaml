molecule:
  charges: 0
  multiplicity: 1
  pbc: [1, 1, 1]
  cell: [8.399091, 8.399091, 8.399091, 90.0, 90.0, 90.0]
md:
  initcond: 0
  ninitcond: 1
  sfhp: nosh
  step: 150
  size: 12.40
  direct: 1
  buffer: 100
  ensemble: nve
  barostat: "off"

lammps:
  method: ff
  lammps_shake: 0
  # The resident service, so this case also covers the multi-condition
  # branch on the channel that had only ever been run with single bonds.
  python_enabled: true

system_constraint:
  # Water 4 (atoms 10-12) has one arm across a face; water 8 (atoms
  # 22-24) has BOTH arms across faces - its stored O-H separations read
  # 7.7295 and 8.1616 A while the minimum image gives 0.9868 and 0.9895.
  # Its H-O-H angle therefore cannot be evaluated on stored coordinates at
  # all, which is the point of picking it.
  unit_length: angstrom
  unit_angle: degree
  unit_energy: hartree
  shake_bond: [[22, 23, 22, 24]]
  shake_angle: [[23, 22, 24]]
  shake_tol: [1e-10, 1e-10]
  shake_vel: [rattle, rattle]
  shake_id: [torn_bonds, torn_angle]
