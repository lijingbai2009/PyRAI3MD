# Constraint example, periodic: a strict bond pair AND an angle on a water that the cell face tears in two, on the resident LAMMPS channel.
# Topology: Dispatcher local / Workflow single / Calculator local
# Run: pyrai3md constraint_md_periodic_torn_angle.yaml
# Fixture: the launch directory needs h2o.data + h2o.in.init + h2o.in.settings, shipped in `pyrai3md/examples/`.
#
# Water 8 of the TIP3P box (atoms 22-23-24) has both O-H arms across a face:
# the stored separations read 7.7295 and 8.1616 A while the minimum image gives
# 0.9868 and 0.9895 A. Nothing about that molecule can be evaluated on stored
# coordinates, which is why it was picked - it is the case where a wrong
# coordinate convention cannot hide behind a small number.
#
# Measured (150 steps, 3 frames), on the shortest image of each frame's own
# lattice: bonds held to 3.647e-12 and 7.772e-16 A, the 23-22-24 angle to
# 3.097e-09 deg, against a declared 1.0e-10. The control that makes those
# numbers mean something: the angle recomputed from stored vectors is
# 10.7611 deg in one frame and 103.4039 in another, a spread of 99.8885 deg -
# an evaluation on stored coordinates would be chasing a variable that jumps by
# nearly a right angle between frames. The half-box and same-component guards
# served it rather than refusing it, because the bond graph does connect all
# three atoms once unfolded.
#
# python_enabled: true, so this is also the multi-condition branch on the
# resident service (the earlier multi-condition run was the subprocess channel).
# Framework-constrained NVE water box with LAMMPS as the force provider.
#
# This is the periodic constraint case of `dev/methods/CONSTRAINT_DEVELOPMENT.md` 附录 B section 6:
# the same 60-atom TIP3P box as md_lammps_nve.yaml, the same cell, with the
# first water's two O-H lengths and its H-O-H angle held by the framework's
# own solver while LAMMPS supplies the energy and gradient. It is the first
# case in which the constraint subsystem runs on a periodic system, so the
# three things it has to show are all read from the framework's own products
# (<title>.md.xyz, <title>.log), not from a fixture:
#
#   1. the three constrained variables stay at the values bound at the
#      reference frame, to the declared tolerance, over every recorded frame;
#   2. the bond lengths are measured across the cell face, i.e. the solve runs
#      on the unfolded geometry and the coordinates that come back are the
#      wrapped ones (a wrapped-only measurement would read a torn pair as an
#      8 Angstrom bond and call it a violation);
#   3. an unconstrained water in the same box drifts normally, so the
#      correction is local to the molecule that asked for it.
#
# LAMMPS-side SHAKE is deliberately off (lammps_shake: 0): the framework owns
# the geometry, and two constraint engines on one trajectory would leave no
# single answer to the question "which length is held".

control:
  title: constraint_md_periodic_torn_angle_example
  jobtype: md
  theory: [lammps]

  # Test switch. A cell that leaves its own starting size interrupts this
  # run instead of continuing; without it the same bound is only reported.
  # Qualification wants the interruption, a production run does not.
  debug: true

atoms: [O, H, H, O, H, H, O, H, H, O, H, H,
