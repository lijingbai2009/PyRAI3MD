# QM/MM crossing search between the two lowest singlet surfaces of ethylene (Molcas CAS-SCF) in a 1581-atom water box (LAMMPS).
# Topology: Dispatcher local / Workflow iterative / Calculator composite (qmmm)
# Run: pyrai3md multiscale_qmmm_mecp.yaml
#
# One spin manifold, not the spin-forbidden pair MECP is named for: the
# Molcas skill builds a single &RASSCF for a plain energy+gradient pass and
# reads only the first block of a multi-spin `ci`/`spin` declaration, so a
# singlet+triplet manifold arrives one surface short and the parser refuses
# it (measured in the test environment, round tmp_20261031_005246). Splitting the
# framework-driven gradient pass into one RASSCF per spin is a Molcas skill
# feature, not a composite one; the same-spin pair keeps this case on the
# crossing algorithm it is here to cover.

control:
  title: multiscale_qmmm_mecp_example
  jobtype: optimize
  theory:
  - molcas
  - lammps
  multiscale_type: qmmm
