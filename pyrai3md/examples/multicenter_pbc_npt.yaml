# Multi-center PySCF-in-LAMMPS MD of a 20-water box under a barostat (NPT)
# Topology: Dispatcher local / Workflow single / Calculator local (ONIOM2)
# Run: pyrai3md multicenter_pbc_npt.yaml
#      (from this directory: the h2o.data, h2o.in.init and h2o.in.settings
#      topology files the LAMMPS layer reads sit beside this input)
#
# The variable-cell sibling of multicenter_pbc_nve.yaml, and the reason that
# one exists. Crossing counts are kept in fractional units, so they are exact
# for the cell they were accrued under and a deforming box moves the ground
# under them (dev/methods/PBC_DEVELOPMENT.md section 4.1). A run that never
# changes its cell cannot show what that costs, which is why this input drives
# the same two straddling waters with a barostat: the region is re-cut from the
# cell of each instant, and `region_reconstruction` reads whether the bonds
# stayed bonds.
#
# The subsystem selection is the same mechanism, and so is its box rule. Only
# the whole-system low-layer task follows the cell: a region task is handed no
# cell (planning keeps `task_cell` None for it), its `pbc` is zeroed, and the
# skill then keeps the template's own box instead of resizing it
# (`input_builder.write_data_file`), because the difference term must not carry
# a box at all. The pressure source is that same whole-system task:
# `PyRAIState.active_stress()` reads the stress of the task that owns the
# geometry (`planning/task.py::resolve_system_task`), the center's motion
# contributing nothing to it - an approximation this run states rather than
# hides, since a center's own virial is never asked for (see the stress note in
# dev/methods/PBC_DEVELOPMENT.md section 7).
#
# Measured on this input as shipped (50 steps): the cell does move - a goes
# from 8.399091 to 8.426207 A (V 592.51 to 598.27 A^3, +0.97%), and the region
# is re-cut from the cell of each of the 6 recorded frames with `debug` on, so
# `region_reconstruction` ran against a deforming box at two centers and found
# nothing. What it does NOT do is receive a virial: the task list carries
# capabilities ['energy','gradient'] on every LAMMPS task and 'stress' only on
# the PySCF center tasks, the L(real) baseline's `stress` flag is False, and the
# run's ensemble record reads Pvir_bar = 0.000000 with all of the pressure in
# Pint_bar (3773.40 bar at the first recorded step). The box therefore expands
# on the kinetic term alone. That routing is a planning defect this example
# exposes rather than introduces (it predates the subsystem selection), it is
# recorded in dev/TODO.md, and no number in this file claims a virial is
# present.
#
# barostat_tau 1000 fs is what the shipped LAMMPS NPT examples of this kind use
# (md_lammps_npt_nhc_berendsen.yaml); 50 steps of 1 fs is enough to move the box
# measurably, which is what is being read out here, and the run stays a minute.

control:
  title: multicenter_pbc_npt_example
  jobtype: md
  theory: [pyscf, lammps]
  gl_seed: 20261008

  # Test switch: a frame whose center cannot be reconnected stops the run
  # instead of only reporting the reading.
  debug: true

