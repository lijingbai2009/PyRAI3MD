# Multiscale composite test: ONIOM2 (OpenQP MRSF high + xTB low), embedding=True, read_charge=False, energy + gradient + SOC
# Topology: Dispatcher local / Workflow single / Calculator composite (3 tasks)
# Run: pyrai3md multiscale_oniom2_embedding_sp.yaml
# True-embedding carriers are `multiscale_oniom2_orca_embedding_sp` and its
# `no_embedding` twin; this openqp case is the layered-bookkeeping control.
#
# This file belongs to the `multiscale_test` family (pmd_env.yaml). It needs
# OpenQP and xTB on the host; the family switch is closed by default so a round
# without those engines does not try to run it.


# Electrostatics: NOT embedded yet, and this case is the measurement of
# that. Read with its no-embedding twin `multiscale_oniom2_no_embedding_sp`
# on round `tmp_20261102_141755`: the three state totals agree to every
# printed digit (-82.4745309685 / -82.2523427404 / -82.3817271295), and the
# high-level deck this run writes carries only the region's net `charge=0` -
# no point charges, no external potential. `control.embedding: true` reaches
# the task queue and stops there, so what this pair certifies is the layer
# bookkeeping and the geometry, not any field effect. Closing it is the
# ONIOM-side change recorded in dev/TODO.md section 2; until that lands, do
# not read these two cases as an embedding test.

control:
  title: multiscale_oniom2_embedding_sp_example
  jobtype: energy gradient soc
  theory: [openqp, xtb]
  multiscale_type: oniom

atoms: [C, C, H, H, H, H, O, H, H]
