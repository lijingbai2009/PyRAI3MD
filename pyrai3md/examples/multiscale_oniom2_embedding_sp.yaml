  - [-1.120191050, -0.756356668, -3.234891306]
  - [-1.876547718, -0.529606640, -0.758833306]
  - [-0.363834382, 0.529606640, -0.758833306]
  - [5.000000000, 5.000000000, 5.000000000]
  - [5.757200000, 5.000000000, 5.587300000]
  - [5.000000000, 5.757200000, 5.586500000]

molecule:
