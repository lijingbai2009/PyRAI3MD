molecule:
  charges: 0
  multiplicity: 1
  # The box `h2o.data` carries, and the numbers `path_mep_pbc.yaml` runs
  # the same 60-atom carrier with. pbc is the periodicity authority, so
  # leaving it off does not make the run molecular: the data template still
  # declares a box and the settings tail still re-issues kspace_style, and
  # the engine runs Ewald anyway. What goes missing is the field probe's
  # pinned split (`kspace_modify gewald`) and the kspace channel of its two
  # tallies - the A/B mismatch measured on round tmp_20261031_005246.
  pbc: [1, 1, 1]
  cell: [8.399091, 8.399091, 8.399091, 90.0, 90.0, 90.0]
  ci: '1'
  spin: '0'
  highlevel:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  q_qm:
