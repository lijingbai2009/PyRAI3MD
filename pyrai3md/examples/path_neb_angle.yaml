# Nudged elastic band with a held angle
# Topology: Dispatcher local / Workflow iterative + batch (band fan-out) / Calculator local
# Run: pyrai3md path_neb_angle.yaml
#
# `path_neb_bond.yaml` holds a length; this case holds an angle. The H-O-H
# angle of a stretched water is 104.5078567647 deg in both endpoint files, so
# what the band moves is the two O-H lengths while the angle stays put - and
# the first and last profile rows carry no residual, because the endpoints
# already satisfy the condition the run binds.
#
# How the condition reaches a band: the anchor is bound once from the initial
# geometry (`constraints/controller.py::bind_reference`), every interior image
# is landed by the framework's own position solve before each round and after
# each FIRE step (`pathbase.py::_land_images`), and the force the band relaxes
# with is the tangential split (`constraint_split`), so the angle the images
# cannot move does not appear in the force that moves them. The endpoints are
# the band's boundary conditions and are never landed.
#
# Functional test: `maxit` is the budget, not a convergence claim; the point is
# that every committed image holds the angle (the runner's post-check, and
# `tools/verify.py` section F, read it off `path_geom.xyz`).
#
# What it needs from the host: PySCF.

control:
  title: path_neb_angle
  jobtype: optimize
  theory: [pyscf]
  driver: main

optimize:
  method: neb
  maxit: 4
  neb_reactant: path_hoh_reactant.xyz
  neb_product: path_hoh_product.xyz
  neb_images: 3
  neb_interpolate: linear
  neb_spring: 0.2
  neb_step: 0.1
  opt_grms: 3e-3
  opt_gmax: 4.5e-3

atoms: [O, H, H]
coordinates:
  - [0.000000000, 0.000000000, 0.000000000]
  - [1.150000000, 0.000000000, 0.000000000]
  - [-0.239900000, 0.927100000, 0.000000000]

molecule:
  charges: 0
  multiplicity: 1

system_constraint:
  unit_angle: degree
  shake_angle: [[2, 1, 3]]
  shake_tol: [1e-10]
  shake_id: [hoh]

pyscf:
  method: hf
  basis: sto3g
  scratch_path: ./scratch
