# ONIOM2 control for the Molcas carrier: the same CASSCF/PySCF two-water
# cluster with embedding off.
# Topology: Dispatcher local / Workflow single / Calculator composite (3 tasks)
# Run: pyrai3md multiscale_oniom2_molcas_no_embedding_sp.yaml
#
# Read with `multiscale_oniom2_molcas_embedding_sp.yaml`: the gas-phase deck
# carries no `&ESPF` block, and the energy difference is the field term.

control:
  title: multiscale_oniom2_molcas_no_embedding_sp_example
  jobtype: energy
  theory: [molcas, pyscf]
  multiscale_type: oniom

atoms: [O, H, H, O, H, H]
coordinates:
  - [1.0, 1.0, 1.0]
  - [2.0, 1.0, 1.0]
  - [1.0, 2.0, 1.0]
  - [5.0, 5.0, 5.0]
  - [6.0, 5.0, 5.0]
  - [5.0, 6.0, 5.0]

molecule:
  charges: 0
  multiplicity: 1
  pbc: [0, 0, 0]
  ci: [1]
  spin: [0]
  highlevel: [1, 2, 3]
  embedding: false

molcas:
  method: casscf
  basis: ano-s-mb
  nact_elec: 6
  nact_orb: 5
  inactive_orb: 2

pyscf:
  method: hf
  basis: sto3g
  scratch_path: ./scratch