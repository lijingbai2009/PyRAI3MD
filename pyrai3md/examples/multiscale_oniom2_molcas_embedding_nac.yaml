# ONIOM2 point-charge embedding with a derivative coupling: Molcas CASSCF
# (two singlets) on one water embedded in the HF charges of a second water
# (PySCF), energy + gradient + nac.
# Topology: Dispatcher local / Workflow single / Calculator composite (3 tasks)
# Run: pyrai3md multiscale_oniom2_molcas_embedding_nac.yaml
#
# ORCA cannot serve this leg: it refuses NACME when point charges are
# embedded (its input builder drops the block). Molcas answers the coupling
# with the two-pass ESPF + field-free deck, the same carrier QMMM uses.

control:
  title: multiscale_oniom2_molcas_embedding_nac_example
  jobtype: energy gradient nac
  theory: [molcas, pyscf]
  multiscale_type: oniom

atoms: [O, H, H, O, H, H]
coordinates:
  - [1.0, 1.0, 1.0]
  - [2.0, 1.0, 1.0]
  - [1.0, 2.0, 1.0]
  - [5.0, 5.0, 5.0]
  - [6.0, 5.0, 5.0]
  - [5.0, 6.0, 5.0]

molecule:
  charges: 0
  multiplicity: 1
  pbc: [0, 0, 0]
  ci: "2"
  spin: "0"
  coupling: "1 2"
  highlevel: [1, 2, 3]
  embedding: true

molcas:
  method: casscf
  basis: ano-s-mb
  nact_elec: 6
  nact_orb: 5
  inactive_orb: 2
  nocsf: true

pyscf:
  method: hf
  basis: sto3g
  scratch_path: ./scratch