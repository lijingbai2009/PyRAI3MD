# ONIOM2 point-charge embedding: ORCA DFT on one water embedded in the HF
# charges of a second water (PySCF), energy + gradient.
# Topology: Dispatcher local / Workflow single / Calculator composite (3 tasks)
# Run: pyrai3md multiscale_oniom2_orca_embedding_sp.yaml
#
# The true-embedding twin of `multiscale_oniom2_orca_no_embedding_sp.yaml`.
# `multiscale_oniom2_embedding_sp.yaml` (openqp high) only proves the layer
# bookkeeping: openqp writes no point charges. Here ORCA does, so the pair
# is the electrostatic measurement.

control:
  title: multiscale_oniom2_orca_embedding_sp_example
  jobtype: energy gradient
  theory: [orca, pyscf]
  multiscale_type: oniom

atoms: [O, H, H, O, H, H]
coordinates:
  - [1.0, 1.0, 1.0]
  - [2.0, 1.0, 1.0]
  - [1.0, 2.0, 1.0]
  - [5.0, 5.0, 5.0]
  - [6.0, 5.0, 5.0]
  - [5.0, 6.0, 5.0]

molecule:
  charges: 0
  multiplicity: 1
  pbc: [0, 0, 0]
  ci: [1]
  spin: [0]
  highlevel: [1, 2, 3]
  embedding: true

orca:
  method: dft
  basis: sto-3g
  functional: pbe0

pyscf:
  method: hf
  basis: sto3g
  scratch_path: ./scratch