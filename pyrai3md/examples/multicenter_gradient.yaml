# Multi-center ONIOM energy + gradient (two openqp MRSF centers in an xtb environment)
# Topology: Dispatcher local / Workflow single / Calculator local (multi-center ONIOM2)
# Run: pyrai3md multicenter_gradient.yaml
#
# Two high-level centers (atoms 1-6 and 7-12, each a C2H4) are treated
# with openqp MRSF (3 singlets S0/S1/S2 per center); the full 60-atom
# system (the two centers plus the water environment) is the low-level
# ONIOM baseline computed with xtb. The center-dimensioned molecule/md
# keywords use the classic ';'-separated string form (docs
# MULTICENTER_DEVELOPMENT.md section 4.2): external indices are 1-based,
# root is 1-based.

control:
  title: multicenter_gradient_example
  jobtype: gradient
  theory: [openqp, xtb]

atoms: [C, C, H, H, H, H, C, C, H, H, H, H,
        O, H, H, O, H, H, O, H, H, O, H, H,
        O, H, H, O, H, H, O, H, H, O, H, H,
        O, H, H, O, H, H, O, H, H, O, H, H,
        O, H, H, O, H, H, O, H, H, O, H, H]
