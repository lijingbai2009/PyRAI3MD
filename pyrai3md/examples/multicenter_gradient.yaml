molecule:
  # charges/multiplicity are per-center region electronic structure.
  # A single scalar broadcasts to every center (both centers neutral
  # singlet here), so the full-system ONIOM baseline L(real) aggregates
  # to charge 0 / singlet. To set centers independently use the
  # ';'-separated form, e.g. `charges: "0; -1"` and
  # `multiplicity: "1; 2"` (L(real) then = charge -1, and the spin
  # pairs off as (0 + 1) mod 2 + 1 = doublet).
  charges: 0
  multiplicity: 1
  highlevel: "1-6; 7-12"
  ci: "3; 3"
  spin: "0; 0"
  coupling: "1 2, 2 3, 1 3; 1 2, 2 3, 1 3"

md:
  root: "1; 1"

openqp:
  method: mrsf
  basis: sto-3g
  functional: bhhlyp

xtb:
  method: gfn2
