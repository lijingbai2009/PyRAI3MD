# Framework-driven NAMD (FSSH) on C2H4 with Molcas CASSCF, taking the
# nonadiabatic coupling from the engine instead of kTDC.
#
# Same molecule, same initial geometry and velocities as `md_molcas_fssh`, with
# two changes that make this the multi-pair leg: `nactype: nac` asks the skill
# for derivative couplings at every step, and the coupling is declared in an
# order that is NOT the sorted ladder ("2 3" first). The framework indexes the
# returned rows by that declaration, so a run whose rows came back in the
# engine's own print order would hop on the wrong surface without anything
# raising. kTDC needs neither: it estimates the coupling from the energy
# curvature, which is why the sibling case can carry three pairs and still ask
# for nothing.

control:
  title: md_molcas_fssh_nac_example
  jobtype: md
  theory: [molcas]

atoms: [C, C, H, H, H, H]
coordinates:
  - [-1.120191050, 0.000000000, -2.661941306]
  - [-1.120191050, 0.000000000, -1.331783306]
  - [-0.590584410, 0.756356668, -3.234891306]
  - [-1.649797690, -0.756356668, -3.234891306]
  - [-1.876547718, -0.529606640, -0.758833306]
  - [-0.363834382, 0.529606640, -0.758833306]

# Initial velocities: one Maxwell-Boltzmann draw at 298.15 K for this
# molecule (fixed seed 20260926, center-of-mass translation removed,
# Bohr/au), shared by every ethylene MD example.
velocities:
  - [0.000233177, -0.000042299, -0.000208531]
  - [-0.000217441, 0.000195315, 0.000185800]
  - [-0.000893166, -0.000054466, 0.000176273]
  - [0.001361820, -0.000285727, 0.000253295]
  - [-0.000024165, -0.000666228, 0.000131482]
  - [-0.000631993, -0.000816868, -0.000290190]

molecule:
  charges: 0
  multiplicity: 1
  ci: "3"
  spin: "0"
  coupling: "2 3, 1 2, 1 3"

md:
  root: "2"
  initcond: 0
  ninitcond: 1
  sfhp: fssh
  nactype: nac
  step: 6
  size: 20.67

molcas:
  method: casscf
  basis: ano-s-mb
  nact_elec: 2
  nact_orb: 2
  inactive_orb: 7
  # Per-step energies, gradients and the declared couplings. With jobtype 'md'
  # the skill would otherwise resolve its internal propagation profile
  # (casscf_abinitio_dynamics, DYNAMIX), which double-advances the geometry
  # against the framework velocity-Verlet integrator, so the profile is pinned.
  # The per-step jobtype is NOT spelled here: `md.nactype: nac` gives the
  # trajectory the `nac` capability and `data/core.py::spell_skill_jobtype`
  # composes the ask. A skill-section `jobtype` line overwrites
  # `control.jobtype` through the flat merge - which is how this case first ran
  # in the test environment: one single-point evaluation, `jobtype energy gradient
  # nac`, zero dynamics steps and no `md.*` trajectory record at all (round
  # tmp_20261102_114641, and its PASS was unjudged for exactly that reason).
  profile: casscf_properties
