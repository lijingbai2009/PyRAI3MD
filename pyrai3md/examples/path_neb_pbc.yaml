lammps:
  method: ff
  lammps_project: h2o
  ewald_accuracy: 1e-4
  lammps_shake: 0
  # Subprocess mode, deliberately: a band dispatches every image of a round
  # at once, and resident mode keys one service per project - measured on this
  # checkout, the second image's evaluation was refused with
  # `LammpsPersistentUnsupported: a resident LAMMPS service is already live
  # for execution_id 'tmp_LAMMPS_runtime_1'`. Each image gets its own process.
  python_enabled: false
