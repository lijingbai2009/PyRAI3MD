# Nudged elastic band in a periodic cell, on a force field
# Topology: Dispatcher local / Workflow iterative + batch (band fan-out) / Calculator local
# Run: pyrai3md path_neb_pbc.yaml
#
# Fixtures: h2o.data + h2o.in.init + h2o.in.settings, and path_h2o_reactant.xyz /
# path_h2o_product.xyz (the same box, one water rotated)
#
# The band arm of a periodic path: every image is a whole box, its pairs are read
# in the nearest image, and each image is wrapped with its own crossing ledger
# before it is dispatched. The two endpoint files carry the cell in their
# extended-XYZ comment line.
#
# What it needs from the host: LAMMPS (the shipped force field, read by project
# name from the launch directory).
control:
  title: path_neb_pbc
  jobtype: optimize
  theory: [lammps]
  driver: main

optimize:
  method: neb
  maxit: 3
  neb_reactant: path_h2o_reactant.xyz
  neb_product: path_h2o_product.xyz
  neb_images: 3
  neb_interpolate: linear
  neb_spring: 0.2
  neb_step: 0.1
  opt_grms: 1.0e-3
  opt_gmax: 2.0e-3

atoms: [O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H]
