molecule:
  charges: 0
  multiplicity: 1
  # Two singlet roots. The state count is derived from `ci` (the nn skill fits
  # one output channel per electronic state), and the coupling pairs the
  # framework derives for a two-state system are validated against it.
  ci: [2]
  spin: [0]
