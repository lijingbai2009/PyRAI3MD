# Hyperparameter grid search, on the arm this framework runs by default: every
# point is submitted to the cluster as its own child runtime.
# Topology: Dispatcher remote / Workflow batch (node `search`) / Calculator local
# Run: pyrai3md nn_grid_search.yaml
# Fixture: egs_small.json, shipped in this directory.
#
# Why remote is the default: a point is one model fit, and fits are what a
# cluster is for. `remotetask` makes each point an independent child runtime
# submitted with sbatch, `multitask` opens the pool that submits them, and
# `multipool` sizes it -- four points here, one worker per point.
#
# The `slurm:` section below is the allocation those children ask for. It is a
# framework-level section: not `&environment` (whose keys describe the shell a
# process starts in) and not the nn skill's own `slurm_*` keywords (which
# belong to the skill's self-submission path). The route is
# `Environment.get_slurm` -> the `state.pmd.environment.slurm` snapshot ->
# `dispatch/slurm_run.SBATCH_OPTIONS`, and the same section is stated in the
# classic `.input` as `&SLURM`, so a run cannot carry different directives
# because of the file format it was launched from.
#
# What is verified where: on a host without Slurm the planner reports this
# example as a skip naming `sbatch`, so the arm is checked locally down to the
# per-point `.rt` payload and the generated `slurm.sh`, and end to end only on
# the deployment. The same scan across a local worker pool is
# `nn_grid_search_local.yaml`, which is what carries the daily gate.
#
# The plan is written to the log before the first point runs, so a scan that
# dies halfway still says what was asked of it.
#
# Cost: four fits of a deliberately small ensemble (`epo: '6;6'`). The wall a point takes is
# the local arm's measurement (12.4-12.7 s each, 31.5-35.9 s for the four across two workers,
# 58-62 s serial), and a submitted point adds whatever the queue charges for it -- which is the
# part this environment cannot measure. These numbers measure the mechanism, and a six-epoch fit is
# not a surface anyone would deploy.

control:
  title: nn_grid_search
  jobtype: search
  theory: [nn]

nn:
  method: mlp_eg
  execution_mode: local
  scratch_path: ./scratch
  nn_project: NN_GRID_REMOTE
  modeldir: ./nn_grid_remote_parent
  mult_nn: 2
  target_states: [0, 1]
  train_data: ./egs_small.json
  # The grid varies these; what is written here is the value a point does not
  # override (and the epochs every point keeps).
  eg:
    epo: '6;6'
    batch_size: 8
    val_split: 0.25
    epostep: 5

search:
  # A skill keyword to the values the scan tries; the points are their
  # Cartesian product, so this is a 2 x 2 = 4 point scan. Both keys are
  # architecture keys, which is what a fresh fit per point needs: a
  # continuation could not apply them.
  grid:
    depth: [1, 2]
    nn_size: [8, 16]
  grid_root: ./grid-search
  # Rank by the channel a point's fit reports; 'max' takes the worst ensemble
  # member, because the folder is deployed as a whole.
  sort_by: energy
  sort_stat: max
  max_grid: 16
  multitask: true
  remotetask: true
  multipool: 4

# The allocation each point's job asks for. `time` is per job, so it bounds one
# fit rather than the scan; `mem` covers a two-member TensorFlow fit of this
# width; `exclusive: false` writes no directive at all, which is why it is
# stated rather than left out -- the key is read, and a false value means
# "share the node".
slurm:
  # No partition: the host's `slurm` section (pmd_env.yaml under the
  # qualification round) names one, and a standalone run on a cluster
  # without that section goes to the cluster's default partition.
  time: '0:20:00'
  mem: 4G
  cpus_per_task: 1
  ntasks: 1
  exclusive: false

