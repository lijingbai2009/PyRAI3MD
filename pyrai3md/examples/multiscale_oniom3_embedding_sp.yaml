# Multiscale composite test: ONIOM3 (OpenQP MRSF high + xTB mid + LAMMPS low, periodic water box), embedding=True, read_charge=False, energy + gradient + SOC
# Topology: Dispatcher local / Workflow single / Calculator composite (5 tasks)
# Run: pyrai3md multiscale_oniom3_embedding_sp.yaml
# True-embedding carriers are `multiscale_oniom3_orca_embedding_{npt,cell}`;
# this openqp case is the layered-bookkeeping control.
#
# This file belongs to the `multiscale_test` family (pmd_env.yaml). It needs
# OpenQP, xTB and LAMMPS on the host; the family switch is closed by default so a round
# without those engines does not try to run it.


# Electrostatics: NOT embedded yet, and this case is the measurement of
# that. Read with its no-embedding twin `multiscale_oniom3_no_embedding_sp`
# on round `tmp_20261102_141755`: the three state totals agree to every
# printed digit (-80.6908629987 / -80.2527598486 / -80.2863963183), and the
# high-level deck this run writes carries only the region's net `charge=0` -
# no point charges, no external potential. `control.embedding: true` reaches
# the task queue and stops there, so what this pair certifies is the layer
# bookkeeping and the geometry, not any field effect. Closing it is the
# ONIOM-side change recorded in dev/TODO.md section 2; until that lands, do
# not read these two cases as an embedding test.

