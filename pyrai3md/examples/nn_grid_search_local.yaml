# Hyperparameter grid search, on the arm a laptop can run: the points go to a
# local worker pool, with no scheduler in between.
# Topology: Dispatcher local / Workflow batch (node `search`) / Calculator local
# Run: pyrai3md nn_grid_search_local.yaml
# Fixture: egs_small.json, shipped in this directory.
#
# Same grid, same ranking, same per-point model directories as
# `nn_grid_search.yaml`; only the execution axis differs. `multitask` opens the
# pool and `multipool: 2` sizes it, so the four points run two at a time inside
# this process tree. This is the arm that carries the daily gate, because it
# needs nothing but TensorFlow on the host.
#
# What this arm does NOT cover: submission. With `remotetask` unset every point
# stays local, so the `.rt` payload, the generated `slurm.sh` and the sacct
# polling are never reached -- that is `nn_grid_search.yaml`, which the planner
# skips by name on a host with no `sbatch`. This arm states no `slurm:` section
# either: it has no allocation to ask for, and the directives belong to the arm
# that submits.
#
# The plan is written to the log before the first point runs, so a scan that
# dies halfway still says what was asked of it.
#
# Cost, measured on the test environment: these four points ran **31.5 s / 32.4 s /
# 35.9 s** wall across the pool of two (12.4-12.7 s per point), the same input
# three times. The serial arm of the same grid measured 58-62 s. These numbers
# measure the mechanism; a six-epoch fit is not a converged surface.

control:
  title: nn_grid_search_local
  jobtype: search
  theory: [nn]

nn:
  method: mlp_eg
  execution_mode: local
  scratch_path: ./scratch
  nn_project: NN_GRID_LOCAL
  modeldir: ./nn_grid_local_parent
  mult_nn: 2
  target_states: [0, 1]
  train_data: ./egs_small.json
  # The grid varies these; what is written here is the value a point does not
  # override (and the epochs every point keeps).
  eg:
    epo: '6;6'
    batch_size: 8
    val_split: 0.25
    epostep: 5

search:
  # A skill keyword to the values the scan tries; the points are their
  # Cartesian product, so this is a 2 x 2 = 4 point scan.
  grid:
    depth: [1, 2]
    nn_size: [8, 16]
  grid_root: ./grid-search-local
  sort_by: energy
  sort_stat: max
  max_grid: 16
  multitask: true
  multipool: 2

atoms: [C, C, C, C, C, C, H, H, H, H, H, H, C, H, C, C, O, H]
coordinates:
  - [-2.9083132, 7.8411096, -0.0702194]
  - [-1.6931105, 8.4133693, 0.6512565]
  - [-3.8459958, 8.3900949, 1.1666596]
