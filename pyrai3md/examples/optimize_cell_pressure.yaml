# Variable-cell relaxation under an applied pressure, on the box that can take
# the step: the acceptance vehicle for `opt_pressure` with a shape-preserving
# scale.
#
# Run: pyrai3md optimize_cell_pressure.yaml
#
# The engine is unchanged (GFN-FF, xtb 6.7.1's only periodic stress producer, the
# load read in bar and converted with the helper the NPT barostats use,
# tensile-positive sign convention, `opt_cell_coupling: isotropic`). What changed
# is the carrier, then the load. This file used to run on the 10 A
# ethylene cube of `optimize_cell_xtb.yaml`, and rounds `tmp_20261018_141444` and
# `tmp_20261018_173454` read the same way on it, one bar pair apart: the endpoint
# residual stayed 987.45141829 bar, the volume went 1000.000000 -> 1000.074059
# A^3, `Converged: False`. The second of those two rounds carried #381's `pV`
# term and the first did not, and their verdict lines differ in nothing but the
# thresholds they were compared against. The reason is a magnitude, read off the same records: the one
# accepted lattice step moved the box by +0.073764 A^3, worth p*dV = +1.692e-5
# Hartree against that step's dE of -7.929e-4 Hartree (47 times smaller), and the
# two largest energy changes of the run came with dV exactly zero. On a box that
# stiff at 1 kbar the enthalpy term is not the thing deciding step acceptance, so
# no amount of getting it right moves this leg.
#
# What round 17 measured on this carrier (`tmp_20261018_200317`) retired the
# other half of that story. The box still grew - 1157.625 -> 1173.837737 A^3 over
# five steps - and the reason turned out not to be stiffness. This box's own
# stress at the end of the zero-pressure run on it measures |sigma| = 1688.1 bar
# of compression, so its rest point `sigma = -p I` lies at a LARGER volume than
# the one it starts from, and a run that expands is a run pointing the right way;
# the residual agrees, 11518.1 bar at the first recorded step and 653.4 bar at the
# last. Ask 2 therefore reads direction from those two facts now (#391): the
# residual has to come down from first step to last, and where the round holds a
# unique zero-pressure twin of this box, same optimizer and coupling, the drift
# under load has to be smaller than the drift the box makes unloaded. The load
# itself went from 1 kbar to 1700 bar, because that is where the numbers above
# place this box's rest point - a prediction read off round 17's endpoint, not a
# measurement of a 1700 bar run. That prediction has now been run: round
# `tmp_20261019_122659` carries this file at 1700 bar, and its residual falls
# 10818.074 -> 181.527 bar while the box grows 1157.625 -> 1172.8207 A^3. That
# is the direction the endpoint of round 17 predicted and one recorded step
# within 181.5 bar of the load's own rest point; it is not a measurement that
# 1700 bar is that rest point, which would need a step to stop on. The
# paragraph below says what the last of these five steps does instead.
#
# The carrier is the box #382/#388 built for the DIIS and crossing arms: one
# ethylene inside 25 waters in a 10.5 A cube, 81 atoms, Packmol 21.2.1 with a
# 2.3 A intermolecular exclusion (26 connected components under periodic
# perception, closest intermolecular contact 2.518 A, density 0.654 g/cm3). It is
# chosen on a measurement, not a hope: on round `tmp_20261018_141444` this box,
# at zero pressure and anisotropic coupling, moved 17.087668 A^3 in five steps.
# Its pV at 1 kbar is 0.265526 Hartree at 1157.625 A^3, so a one-angstrom-cubed
# step is worth 3.4e-4 Hartree, the order the trust-region ratio actually
# compares. Paired with `optimize_cell_pressure_aniso.yaml` (#388) it differs by
# one keyword, `opt_cell_coupling`, and that difference is what the two runs are
# there to show.
#
# What this case has to show, all of it read off the framework's own products.
# The post-run judge (`qualification/runner.py::_check_cell_pressure`, #371) asks
# these four, and reports the numbers either way:
#
#   1. the run's own progress block carries an `External Pressure` row equal to
#      the `opt_pressure` this file declares. This is the check that a
#      `cell_gmax` cannot be: the recorded lattice force is the residual of
#      `sigma + p I` in either case, so a search that ignored the keyword leaves
#      a perfectly sane-looking row - which is the shape of every defect this
#      round has had to chase;
#   2. the box moves toward its rest point: the residual of `sigma + p I` has to
#      come down from the first recorded step to the last, and - against the
#      round's unique zero-pressure twin of this box, same optimizer and coupling,
#      when it has one - the drift under load has to be smaller than the drift the
#      box makes on its own. Direction is not read off the sign of `opt_pressure`:
#      the paragraph above says why a correct run here expands;
#   3. the endpoint residual is under the pair of bar thresholds below,
#      and 4. the run says Converged: True - both READ AND PRINTED, NOT
#      JUDGED (the user's ruling of 2026-10-19, because this file is a
#      functional test at `maxit` 5). Two measurements say what judging
#      them at this budget would actually judge. On the one periodic
#      engine installed on the development machine (LAMMPS, the
#      1575-atom `water25` box, same coupling, 2000 bar, 25 steps) the
#      residual fell 21076.0 -> 1058.4 bar and no further: its lowest
#      reading is the second-to-last step, the last step rebounds to
#      3730.2, and the enthalpy is still dropping 0.096 Hartree a step,
#      so the band is not what a longer budget approaches - the run has
#      not arrived. On this file's own carrier the low point is a
#      crossing rather than a rest: round `tmp_20261019_122659` records
#      181.5 bar at 1168.8679 A^3, the two steps either side put the
#      rest point 0.49 A^3 further along (an interpolation of recorded
#      readings at 288.0 bar per A^3, not a measurement), and the step
#      the run then took was 3.95 A^3 - eight times the distance left to
#      travel. What decides how fast a run approaches the band is the step
#      size, and the step size is the trust radius
#      (`workflow/optimizer/minima.py:108`, initial 0.3 Bohr) - a keyword
#      since #396, `opt_trust_radius`, which this file deliberately leaves
#      unset. What the keyword was measured to do, on the one carrier this
#      host can run (LAMMPS, the 1575-atom `water25` box, same coupling,
#      2000 bar, 100/100, 15 steps, `trust_radius: 0.1`): the residual floor
#      improved from 1058.4 bar to 220.189 bar, the resizing still hit its
#      0.5 Bohr ceiling within three steps, the band was still not entered,
#      and with the radius collapsed to 0.03125 the last two frames sat at
#      249.7 and 236.5 bar on a volume frozen at 15696.7969 A^3. So the step
#      bound decides the approach, while the floor belongs to the carrier -
#      this box's energy is not a smooth function of its own cell, the fact
#      the LAMMPS skill document records. Naming a converged pressurised
#      relaxation therefore means the carrier that passed through 181.5 bar
#      between two frames, which needs the engine this environment does not have.
#
# One number answers 3 and 4 together on this coupling, and that is a property of
# the coupling rather than a shortcut: under `isotropic` the framework reports the
# mean normal stress for BOTH rows (`optimizer/base.py:533-546`), which is why the
# two rounds above printed rms and max as the same 987.5 bar at every step. The
# `[COUPLING]` verdict reads the same row: a shape-preserving run leaves the
# three lattice row-length ratios where they were, so its `shape_ratio_change`
# reads an exact 0.0 (measured on both rounds), and that is the floor the
# anisotropic pair is judged against.
#
# What the objective is, and why the row's energy is not an engine's number. The
# lattice half of the gradient is `V (sigma + p I)^T H^-T`, the derivative of
# `E + pV`, so the energy the trust-region ratio measures has to carry the same
# `pV` (`optimizer/base.py::_enthalpy`, #381). It follows that the `Energy:` row
# of the run log and the `energy` column of `opt_status.txt` are the ENTHALPY on
# this leg, a number no engine printed - which is why `tools/verify.py` counts a
# pressure leg as an objective (`pressurized`) and does not compare its column
# against the engine files it keeps. What #381 does NOT buy is the paragraph
# above's conclusion: on the cube it changed the numbers by 1e-8 Hartree and
# changed nothing else, and this carrier is the reply to that, not a consequence
# of it.
#
# `maxit` is 5, the budget every shipped example is held to so a round stays
# cheap, and the ruling of 2026-10-19 keeps it there: this file is a functional
# test, so asks 3 and 4 - the bar pair below and the run's own `Converged` line
# - are read off the last progress block and printed against their thresholds
# without deciding the verdict. The bar pair is 100/100 by the user's ruling of
# 2026-10-18, which raised it from the 40/60 that #371 shipped with, and it
# stays declared here while the carrier changes under it; the strain pair is the
# schema's own 5e-5 / 7e-5, written out because this leg is judged on it. What
# still decides pass or fail is ask 1 (the `External Pressure` row reached the
# search) and ask 2 (the residual comes down, and the drift under load is
# smaller than the same box's unloaded drift).
#
# Round `tmp_20261019_122659`, 251 rows, 244 passed and 4 failed with no
# errors, `tools/verify.py` clean over the downloaded directory. All four
# failures were this band and this `Converged` line on the two pressurized
# legs and their two zero-pressure twins; recomputed under the ruling above
# they read pass. Ask 2 fired for the first time on that round: this leg
# paired with its isotropic twin `optimize_cell_iso`, which drifted
# 17.614350 A^3 with no load on it against 15.195667 A^3 here under 1700.0
# bar, and `optimize_cell_pressure_aniso` paired with `optimize_cell_aniso`,
# 17.087668 A^3 unloaded against 14.748035 A^3 under load.
control:
  title: optimize_cell_pressure_example
  jobtype: optimize
  theory: [xtb]

atoms: [C, C, H, H, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H]
