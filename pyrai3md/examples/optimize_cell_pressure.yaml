molecule:
  charges: 0
  multiplicity: 1
  pbc: [1, 1, 1]
  cell: [10.5, 10.5, 10.5, 90.0, 90.0, 90.0]

optimize:
  method: minima
  maxit: 5
  opt_energy: 1.0e-4
  opt_grms: 1.0e-3
  opt_gmax: 2.0e-3
  opt_drms: 2.0e-3
  opt_dmax: 4.0e-3
  optimize_cell: true
  # Named rather than inherited; see the header.
  opt_cell_coupling: isotropic
  # The box's own two pairs. The bar pair is the user's ruling of 2026-10-18 and
  # is not inherited by any other case; the strain pair equals the schema default
  # (schema/config.py:180-181) and is written out because this leg is judged on
  # it. The load is 1700 bar, isotropic: 10 kbar came down to 1 kbar after round
  # tmp_20261017_180206 walked through its target residual at that load and kept
  # compressing, and it goes back up to 1700 bar because this box measures
  # |sigma| = 1688.1 bar of compression at the end of its own zero-pressure
  # relaxation (round tmp_20261018_200317), which is where `sigma = -p I` sits.
  opt_csrms: 100.0
  opt_csmax: 100.0
  opt_cerms: 5.0e-5
  opt_cemax: 7.0e-5
  opt_pressure: 1700.0

xtb:
  method: gfn_ff
  profile: gfn_ff_gradient
  charge: 0
  uhf: 0
  execution_mode: local
