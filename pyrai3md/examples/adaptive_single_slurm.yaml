# Single-method adaptive sampling of ethylene: every stage is submitted - MD and training as framework runtimes, the reference through the skill's own slurm submission.
# Topology: Dispatcher slurm / Workflow adaptive (iterative, submitted children) / Calculator local (job body)
# Run: pyrai3md adaptive_single_slurm.yaml

control:
  title: adaptive_ethylene
  jobtype: adaptive
  theory: [nn]
  reference: [pyscf]
  gl_seed: 20261105
atoms: [C, C, H, H, H, H]
coordinates:
- [-1.1201910500, 0.0000000000, -2.6619413060]
- [-1.1201910500, 0.0000000000, -1.3317833060]
- [-0.5905844100, 0.7563566680, -3.2348913060]
- [-1.6497976900, -0.7563566680, -3.2348913060]
- [-1.8765477180, -0.5296066400, -0.7588333060]
- [-0.3638343820, 0.5296066400, -0.7588333060]
molecule:
  charges: 0
  multiplicity: 1
  ci: [2]
  spin: [0]
  # no partition: the whole six-atom ethylene surface is trainable
md:
  initcond: read
  ninitcond: 5
  step: 10
  size: 20.67
  root: 1
  activestate: 0
  sfhp: nosh
  nactype: ktdc
  rk4: 1
  format: molden
adaptive:
  maxiter: 2
  maxsample: 1
  record_step: 4
  keep_md: 1
  load: 1
  multitask: true
  remotetask: true
  md_multitask: true
  md_multipool: 5
  md_remotetask: true
  reference_multitask: true
  reference_multipool: 5
  reference_remotetask: 1
  remote_train: 1
  maxenergy: 0.0
  minenergy: 0.0
  maxgrad: 0.0
  mingrad: 0.0
  check_population: 0
  check_energy_order: 0
  gap_tolerance: 1.0e-6
  sample_energy: 1
  sample_grad: 1
  sample_nac: 0
  sample_soc: 0
  sample_dipole: 0
  sample_transition_dipole: 0
  sample_oscillator_strength: 0
nn:
  method: mlp_eg
  modeldir: ./nn_ethylene_init
  train_data: ./egs_ethylene_100.json
  mult_nn: 2
  nstate: 2
  target_states: [0, 1]
  predict_thread: 1
  thread: 1
  write_step_log: 0
  predict_std: 1
  execution_mode: local
  scratch_path: ./scratch
  eg:
    depth: 2
    nn_size: 16
    batch_size: 5
    epo: 1
    learning_rate: 1.0e-3
    epostep: 1
    loss_weights: '1 10'
    val_split: 0.1
pyscf:
  method: tda
  functional: pbe
  basis: sto-3g
  nstate: 2
  target_states: [0, 1]
  execution_mode: local
  keep_tmp: 0
  thread: 1
  slurm_time: '00:30:00'
  slurm_memory: 4000
  slurm_ntasks: 1

slurm:
  # No partition: the host's `slurm` section (pmd_env.yaml under the
  # qualification round) names one, and a standalone run on a cluster
  # without that section goes to the cluster's default partition.
  time: '00:30:00'
  mem: 5G
  cpus_per_task: 1
  ntasks: 2

