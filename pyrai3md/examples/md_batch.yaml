# Multiple trajectories through Slurm dispatch
# Topology: Dispatcher slurm / Workflow remotetask+multitask / Calculator local (worker)
# Run: pyrai3md md_batch.yaml

control:
  title: md_batch_example
  jobtype: md
  theory: [pyscf]

atoms: [C, C, H, H, H, H]
coordinates:
  - [-1.120191050, -0.000000000, -2.649741092]
  - [-1.120191050, 0.000000000, -1.343983520]
  - [-0.472508457, 0.648151398, -3.225344333]
  - [-1.767873643, -0.648151398, -3.225344333]
  - [-1.768342448, -0.647682593, -0.768380279]
  - [-0.472039652, 0.647682593, -0.768380279]

# Initial velocities below are the pre-ensemble default and are used
# only when initcond resolves to the loaded state. For these cases the
# starting geometry and velocity come from <title>.init.xyz, whose
# frames are Boltzmann draws at 300 K about the HF/STO-3G equilibrium
# structure written above.
velocities:
  - [0.000233177, -0.000042299, -0.000208531]
  - [-0.000217441, 0.000195315, 0.000185800]
  - [-0.000893166, -0.000054466, 0.000176273]
  - [0.001361820, -0.000285727, 0.000253295]
  - [-0.000024165, -0.000666228, 0.000131482]
  - [-0.000631993, -0.000816868, -0.000290190]

molecule:
  charges: 0
  multiplicity: 1
  ci: [1]
  spin: [0]

md:
  # Starting states come from <title>.init.xyz beside this file:
  # 5 frames are shipped, the first 3 are used here, so the
  # trajectories are distinct samples instead of copies.
  initcond: read
  ninitcond: 3
  sfhp: nosh
  step: 10
  size: 20.67
  temperature: 300
  # Each trajectory is submitted as a remote child runtime (remotetask)
  # and the pool that submits them is sized by multipool.
  multitask: true
  remotetask: true
  multipool: 3

environment:
  slurm_partition: default
  slurm_time: '01:00:00'

pyscf:
  method: hf
  basis: sto3g
  scratch_path: ./scratch
