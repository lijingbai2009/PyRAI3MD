# Constraint example for the merged constraint subsystem.
# Topology: Dispatcher local / Workflow single / Calculator local
# Run: pyrai3md constraint_md_metad.yaml
control:
  title: constraint_md_metad_example
  jobtype: md
  gl_seed: 20260929   # the single seed source (md.seed had no field)
  theory: [pyscf]

atoms: [O, H, H]
coordinates:
  - [0.000000000, 0.000000000, 0.117340000]
  - [0.000000000, 0.757540000, -0.469360000]
  - [0.000000000, -0.757540000, -0.469360000]

molecule:
  charges: 0
  multiplicity: 1
  ci: [1]
  spin: [0]

pyscf:
  method: hf
  basis: sto3g
  scratch_path: ./scratch

md:
  initcond: 0
  ninitcond: 1
  sfhp: nosh
  step: 5
  size: 20.67
  temperature: 100

system_constraint:
  unit_length: angstrom
  unit_angle: degree
  unit_energy: hartree
  cv_bond: [[1, 2]]
  cv_name: oh
  meta_cv: oh
  meta_height: 0.0005
  meta_width: 0.05
  meta_pace: 2
  meta_id: explore
