# ONIOM2 point-charge embedding with Molcas: CASSCF on one water embedded in
# the HF charges of a second water (PySCF), energy only.
# Topology: Dispatcher local / Workflow single / Calculator composite (3 tasks)
# Run: pyrai3md multiscale_oniom2_molcas_embedding_sp.yaml
#
# Molcas consumes the rows through `&ESPF External = N Angstrom` (embedding
# 'charge'), not XField. Energy-only is deliberate: the charge block and the
# electrostatic shift are what this case measures; the gradient path is
# carried by the ORCA cases.

control:
  title: multiscale_oniom2_molcas_embedding_sp_example
  jobtype: energy
  theory: [molcas, pyscf]
  multiscale_type: oniom

atoms: [O, H, H, O, H, H]
coordinates:
  - [1.0, 1.0, 1.0]
  - [2.0, 1.0, 1.0]
  - [1.0, 2.0, 1.0]
  - [5.0, 5.0, 5.0]
  - [6.0, 5.0, 5.0]
  - [5.0, 6.0, 5.0]

molecule:
  charges: 0
  multiplicity: 1
  pbc: [0, 0, 0]
  ci: [1]
  spin: [0]
  highlevel: [1, 2, 3]
  embedding: true

molcas:
  method: casscf
  basis: ano-s-mb
  nact_elec: 6
  nact_orb: 5
  inactive_orb: 2

pyscf:
  method: hf
  basis: sto3g
  scratch_path: ./scratch