# ONIOM2 point-charge embedding across a crossing search: ORCA TDDFT
# (two singlets) on one water in the HF charges of a second water (PySCF).
# Topology: Dispatcher local / Workflow iterative / Calculator composite (oniom)
# Run: pyrai3md multiscale_oniom2_orca_embedding_meci.yaml
# ORCA drops NACME when point charges are embedded, so this case reads the
# gap search and the embedded gradient, not the branching plane. The Molcas
# nac carrier is `multiscale_oniom2_molcas_embedding_nac`.

control:
  title: multiscale_oniom2_orca_embedding_meci_example
  jobtype: optimize
  theory: [orca, pyscf]
  multiscale_type: oniom

atoms: [O, H, H, O, H, H]
coordinates:
  - [1.0, 1.0, 1.0]
  - [2.0, 1.0, 1.0]
  - [1.0, 2.0, 1.0]
  - [5.0, 5.0, 5.0]
  - [6.0, 5.0, 5.0]
  - [5.0, 6.0, 5.0]

molecule:
  charges: 0
  multiplicity: 1
  pbc: [0, 0, 0]
  ci: 2 1
  spin: 0 0
  coupling: 1 2
  highlevel: [1, 2, 3]
  embedding: true

optimize:
  method: meci
  # 0-based surfaces, the same pair `coupling: 1 2` declares 1-based.
  state_i: 0
  state_j: 1
  maxit: 2

orca:
  method: tddft
  basis: sto-3g
  functional: pbe0
  tda: true

pyscf:
  method: hf
  basis: sto3g
  scratch_path: ./scratch