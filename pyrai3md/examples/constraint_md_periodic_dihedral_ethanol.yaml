# Constraint example, periodic dihedral constraint on a real force field: ethanol in a 10 A box.
# Topology: Dispatcher local / Workflow single / Calculator local
# Run: pyrai3md constraint_md_periodic_dihedral_ethanol.yaml
# Resident LAMMPS service (python_enabled: true). Two gaps in the
# compressed force-field model had to close for this project: dihedral and
# improper entity rows were out of scope for renumbering, and a template
# that lists only same-type `pair_coeff` rows was read as missing the cross
# coefficients its `pair_modify mix arithmetic` line derives. Both are
# covered now (service/builder/ff_model.py); the shipped box compresses 98
# atom / 935 bond / 5312 angle / 986 dihedral library types down to 4/4/5/4.
# Fixture: the launch directory needs ethanol.data + ethanol.in.init + ethanol.in.settings, shipped in `pyrai3md/examples/`.
#
#   pyrai3md constraint_md_periodic_dihedral_ethanol.yaml
#
# The fixture the water box could not give: a molecule whose force field carries
# torsion terms. The topology is FFautomator's (`ethanol/ethanol_ffa.yaml` ->
# `ethanol/lammps/equilibration/ethanol.data`), built on the ethanol structure
# this repository's own PySCF skill relaxed at PBE0/def2-SVP (33 GDIIS steps,
# final Gradient Max 1.6132e-04) and ORCA then evaluated at the same level
# (single point -154.736415620280 Hartree, `ethanol/sp/ethanol_sp.stdout`). The
# RESP charges are fitted to that same wavefunction.
#
# What the case has to show, read from the framework's own products:
#   1. the declared torsion C-C-O-H (atoms 1-2-3-4, dihedral type 649 in the
#      topology) stays at the value bound on the reference frame to the declared
#      1.0e-10 tolerance, while the molecule is really moving;
#   2. an UNconstrained torsion of the same molecule moves in the same run, so
#      the hold is local to the declared row and not a frozen trajectory;
#   3. the framework's constraint runs on the engine-integration-free side:
#      LAMMPS supplies energy and gradient, the framework owns the geometry
#      (control.driver='main', D-27), and the recorded energy carries the
#      decomposition printed under `&constraint energies in Hartree` (D-18).
#
# NVE with a thermal draw of the initial velocities: with zero velocities nothing
# moves and a held torsion proves nothing.
control:
  title: constraint_md_periodic_dihedral_ethanol_example
  jobtype: md
  gl_seed: 20261002   # the single seed source (md.seed had no field)
  theory: [lammps]

  # Test switch: a cell that leaves its own starting size interrupts the run
  # instead of continuing it.
  debug: true

atoms: [C, C, O, H, H, H, H, H, H]
coordinates:
  - [1.58488900, 2.21504500, 0.77140300]
  - [0.87576400, 0.88553400, 1.01372200]
  - [0.44558800, 0.84016400, 2.35244900]
  - [0.00000000, 0.00000000, 2.49727600]
  - [2.63423000, 2.08278400, 0.47157500]
  - [1.57202000, 2.78774800, 1.71025700]
  - [1.08879700, 2.82112700, 0.00000000]
  - [1.56201300, 0.04462600, 0.78786300]
  - [0.01954500, 0.78155200, 0.31719300]

molecule:
  charges: 0
  multiplicity: 1
  pbc: [1, 1, 1]
  cell: [10.0, 10.0, 10.0, 90.0, 90.0, 90.0]

md:
  initcond: 0
  ninitcond: 1
  temperature: 100.0
  sfhp: nosh
  step: 6
  size: 20.67
  direct: 1
  buffer: 1
  ensemble: nve
  barostat: "off"
  checkpoint: 0

lammps:
  method: ff
  # The framework owns the geometry on this driver; the skill's own constraint
  # keywords are inert (D-27).
  lammps_shake: 0
  python_enabled: true
  lammps_project: ethanol
  ewald_accuracy: 0.0001

system_constraint:
  # The C-C-O-H torsion, written as the topology knows it (dihedral row
  # 1 2 3 4). Strict geometric conditions travel in the `bonds` field whatever
  # the kind is; `atoms:` is refused by name.
  unit_length: angstrom
  unit_angle: degree
  unit_energy: hartree
  shake_dihedral: [[1, 2, 3, 4]]
  shake_tol: 1e-10
  shake_vel: rattle
  shake_id: ccoh_torsion
