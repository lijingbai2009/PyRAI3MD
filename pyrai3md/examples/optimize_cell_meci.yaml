# Crossing search toward a minimum-energy conical intersection, on a box whose
# centre supplies the two surfaces and whose environment carries the lattice.
#
# Run: pyrai3md optimize_cell_meci.yaml
#
# Same plan as `optimize_cell_mecp.yaml` - centre first, whole system last in
# `theory`, one ethylene as the high region, 25 waters plus the ethylene at the
# low level - and the two cases differ in one request only: MECIOptimizer asks
# for a derivative coupling to span the branching plane with the gradient
# difference, MECPOptimizer does not (meci.py:60 `uses_derivative_coupling`).
#
# What this carrier can and cannot hand back, measured rather than assumed: the
# PySCF route has no derivative-coupling producer in this package. Its schema
# initialises `nac` to zeros (pyscf_skill/schema/normalize.py:226) and no service
# module of that skill writes it, so the coupling that arrives is a zero vector
# and `_project_out` drops it at the direction floor (meci.py:250-258). The run
# therefore walks the gap down with ONE branching-plane direction and says so in
# its report, which is the documented behaviour of a crossing search that has
# the difference but not the coupling - not a failure, and the reason the
# example prints the count instead of claiming two. A two-direction MECI needs a
# carrier that answers with the coupling (BAGEL, Molcas), and this box has
# neither installed in the test environment it runs on.
# The system is one ethylene inside 25 waters in a 10.5 A cube, 81 atoms, and it
# is a built structure rather than a hand-written one: Packmol 21.2.1 placed it
# with a 2.3 A intermolecular exclusion under its periodic constraint, the
# ethylene pinned at the cell centre. Readings taken off the finished box with
# this package's own perception (utilities/image_flags.py::bond_graph, minimum
# image, periodic): 26 connected components, so every molecule is whole; closest
# intermolecular contact 2.518 A; nothing under a non-bonded floor once bonded
# and 1-3 pairs are excluded; density 0.654 g/cm3. That edge is what the audit
# asked for: cropping the same composition out of the equilibrated 525-water box
# gave 81 atoms but 0.54 g/cm3, because a sphere cut from a periodic box always
# leaves its corners empty and its cluster presses on its own image.
#
# Cost is NOT measured on this environment: xtb is not installed here, so the round
# gives the first reading.
control:
  title: optimize_cell_meci_example
  jobtype: optimize
  theory: [pyscf, xtb]

atoms: [C, C, H, H, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H]
