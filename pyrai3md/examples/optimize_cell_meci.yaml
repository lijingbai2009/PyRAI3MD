molecule:
  charges: 0
  multiplicity: 1
  pbc: [1, 1, 1]
  cell: [10.5, 10.5, 10.5, 90.0, 90.0, 90.0]
  # The centre is the ethylene, whole: atoms 1 to 6, closed shell.
  highlevel: [[1, 2, 3, 4, 5, 6]]
  # The manifold this run solves, declared in the system section and not under
  # `optimize`: the state count is what Calculator.sync() propagates to every
  # task config, while state_i and state_j only name the pair the search
  # drives. Three states because the pair is S1 and S2, and a count below the
  # larger index would leave the optimizer selecting a state never solved.
  ci: "3"
  spin: "0"

optimize:
  method: meci
  state_i: 1
  state_j: 2
  maxit: 5
  opt_energy: 1.0e-4
  opt_grms: 1.0e-3
  opt_gmax: 2.0e-3
  opt_drms: 2.0e-3
  opt_dmax: 4.0e-3
  opt_csrms: 40.0
  opt_csmax: 60.0
  opt_cerms: 5.0e-5
  opt_cemax: 7.0e-5
  optimize_cell: true

xtb:
  method: gfn_ff
  profile: gfn_ff_gradient
  charge: 0
  uhf: 0
  execution_mode: local

pyscf:
  method: tda
  basis: 631gs
