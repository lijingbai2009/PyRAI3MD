# Variable-cell relaxation on a force field with one strict angle: the
# angle-only counterpart of optimize_cell_lammps_constrained.yaml.
#
# Run: pyrai3md optimize_cell_lammps_angle.yaml
# Fixtures: water25.data + water25.in.init + water25.in.settings (a 25 A TIP3P
# box, 525 waters; the same smooth-cell box the other cell cases use).
#
# Why this case exists: the combined constrained example holds an O-H bond and
# the H-O-H angle at once, so a failure there cannot say which condition's
# lattice derivative was wrong. This case holds only the H-O-H angle of the
# first water (rows 2-1-3) and pins the second water's oxygen (row 4); the box
# moves, so the angle's own cell term is exercised without a bond term beside
# it. The unit-level contraction is priced in
# test_constraint_cell_coupling.py::test_the_angle_contraction_is_the_derivative_of_the_condition
# and its cell-force wiring in
# test_a_held_angle_runs_and_its_term_is_in_the_cell_force; this example is the
# functional end-to-end carrier.
#
# Functional test, not a convergence test: maxit: 6 keeps the run cheap, and
# the post-run check asks only for cell columns and a changed volume. The
# converged box position for an angle is deliberately not claimed: its
# derivative is nonzero in several cell entries, so the endpoint needs a
# self-consistent solve (dev/TODO.md records that as next-stage).
#
# Measured locally on 2026-10-20 (`lmp_serial`, the shipped water25 fixture):
# 6 s wall; the status record moves 15721.57528502 -> 15777.17850031 A^3 over
# 7 steps (post-check: volume moved 55.603215, `[COUPLING]` row-length ratios
# moved by 2.248e-04); the held H-O-H angle stays at 1.8242047246 rad with a
# 3.8e-11 residual; the run ends at maxit as designed
# (`Status: failed: Maximum optimization steps reached`).
control:
  title: optimize_cell_lammps_angle_example
  jobtype: optimize
  theory: [lammps]
  debug: false

molecule:
  charges: 0
  multiplicity: 1
  pbc: [1, 1, 1]
  cell: [25.386649, 23.267958, 26.615364, 90.0, 90.0, 90.0]

optimize:
  method: minima
  maxit: 6
  # Criteria for a 1575-atom force-field box, not for an electronic-structure
  # search: 5e-3 Hartree/Bohr on both gradient rows (the atomic and the cell
  # half are judged against the same pair, per CELL_OPT_DEVELOPMENT 5.4), and
  # 1e-5 -> 1e-4 on the energy row because the last accepted step of the
  # measured run changed the energy by 6.2e-5 while the row it was judged on
  # still carried a stale 2.2e-3 from before a rejection burst.
  opt_energy: 1.0e-4
  opt_grms: 5.0e-3
  opt_gmax: 5.0e-3
  opt_drms: 2.0e-3
  opt_dmax: 4.0e-3
  optimize_cell: true

system_constraint:
  unit_length: angstrom
  unit_angle: degree
  unit_energy: hartree
  shake_angle: [[2, 1, 3]]
  shake_tol: [1e-10]
  shake_vel: [rattle]
  shake_id: [hoh]
  fix_atoms: 4
  fix_id: pinned_oxygen

lammps:
  method: ff
  lammps_project: water25
  ewald_accuracy: 0.0001
  lammps_shake: 0
  python_enabled: true

