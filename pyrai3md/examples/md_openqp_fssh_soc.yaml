# Framework-driven NAMD (FSSH) with spin-orbit coupling on C2H4, OpenQP MRSF
# Topology: Dispatcher local / Workflow single / Calculator local
# Run: pyrai3md md_openqp_fssh_soc.yaml
#
# &md dosoc is what puts SOC into the plan: the planner turns it into the
# `soc` capability, the skill resolves the resulting request to a
# two-manifold runtype=data run, and every step comes back with the state
# energies, the state gradients and the singlet-triplet couplings in one
# call. FsshIntegrator folds those couplings into the model Hamiltonian
# (workflow/integrator/fssh.py:_build_hamiltonian), in cm-1 as OpenQP
# reports them.
#
# ci "2 1" with spin "0 1" is two singlets and one triplet. The coupling
# declaration "1 2, 2 3, 1 3" splits into one NAC pair (S0/S1) and two SOC
# pairs (S1/T0 and S0/T0) - both singlet-triplet couplings a three-state
# ladder can carry, so the hop sampling sees the S/T block whole. nactype
# stays ktdc: OpenQP cannot answer a NAC vector alongside spin-orbit
# coupling, and the skill refuses that combination by name.
# activestate is on, so each step's gradient selectors (grad_s / grad_t)
# follow the current state instead of a fixed list.

control:
  title: md_openqp_fssh_soc_example
  jobtype: md
  theory: [openqp]

atoms: [C, C, H, H, H, H]
coordinates:
  - [-1.120191050, 0.000000000, -2.661941306]
  - [-1.120191050, 0.000000000, -1.331783306]
  - [-0.590584410, 0.756356668, -3.234891306]
  - [-1.649797690, -0.756356668, -3.234891306]
  - [-1.876547718, -0.529606640, -0.758833306]
  - [-0.363834382, 0.529606640, -0.758833306]

# Initial velocities: one Maxwell-Boltzmann draw at 298.15 K for this
# molecule (fixed seed 20260926, center-of-mass translation removed,
# Bohr/au), shared by every ethylene MD example.
velocities:
  - [0.000233177, -0.000042299, -0.000208531]
  - [-0.000217441, 0.000195315, 0.000185800]
  - [-0.000893166, -0.000054466, 0.000176273]
  - [0.001361820, -0.000285727, 0.000253295]
  - [-0.000024165, -0.000666228, 0.000131482]
  - [-0.000631993, -0.000816868, -0.000290190]

molecule:
  charges: 0
  multiplicity: 1
  ci: "2 1"
  spin: "0 1"
  coupling: "1 2, 2 3, 1 3"

md:
  root: "2"
  initcond: 0
  ninitcond: 1
  sfhp: fssh
  dosoc: 1
  activestate: 1
  nactype: ktdc
  step: 5
  size: 20.67

openqp:
  method: mrsf
  basis: sto-3g
  functional: bhhlyp

# Measured on OpenQP 1.3.1 (5 steps to completion): the framework and the
# skill both carry nsoc 2 with soc_pair_map [[1, 2], [0, 2]], each step's
# deck is runtype=data with ispher=false, nstate_s=2, nstate_t=1, soc=true
# and no nac keyword, and the last step's 6-row socme (2 x 1 x 3 Ms) returns
# results['soc'] = [0.0943, 0.8181] cm-1 in that pair order, with the
# gradient only on the followed state (norm 0.110462 hartree/bohr; the other
# two rows are zero because no selector asked for them).
