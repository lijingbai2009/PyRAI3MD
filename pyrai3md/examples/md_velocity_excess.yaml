# Initial-velocity control: start the run with more kinetic energy.
# Topology: Dispatcher local / Workflow single / Calculator local
# Run: pyrai3md md_velocity_excess.yaml
#
# `excess` is a kinetic energy in Hartree added to the velocities the input
# carries, once, before step 1. Read it in title.md.energies: the Ekin column
# of the first recorded step is the Ekin of the same structure written in
# md_velocity_excess_base.yaml plus 5.0e-4 Ha (0.31 kcal/mol). Scaling happens
# on the velocity vector with f = sqrt((K0 + excess) / K0), because kinetic
# energy is quadratic in velocity.
#
# Not to be combined with `scale` or `target`: the three are spellings of one
# request and the input refuses two of them. A resumed segment is never scaled
# again -- only a process that starts at step 0 applies this.

control:
  title: md_velocity_excess_example
  jobtype: md
  gl_seed: 20261008
  theory: [pyscf]

atoms: [C, C, H, H, H, H]
coordinates:
  - [-1.120191050, -0.000000000, -2.649741092]
  - [-1.120191050, 0.000000000, -1.343983520]
  - [-0.472508457, 0.648151398, -3.225344333]
  - [-1.767873643, -0.648151398, -3.225344333]
  - [-1.768342448, -0.647682593, -0.768380279]
  - [-0.472039652, 0.647682593, -0.768380279]

# The starting velocities below are the same six rows the base example
# carries, so the only difference between the two runs is the excess.
velocities:
  - [0.000233177, -0.000042299, -0.000208531]
  - [-0.000217441, 0.000195315, 0.000185800]
  - [-0.000893166, -0.000054466, 0.000176273]
  - [0.001361820, -0.000285727, 0.000253295]
  - [-0.000024165, -0.000666228, 0.000131482]
  - [-0.000631993, -0.000816868, -0.000290190]

molecule:
  charges: 0
  multiplicity: 1
  ci: [1]
  spin: [0]

pyscf:
  method: hf
  basis: sto3g
  scratch_path: ./scratch

md:
  initcond: 0
  ninitcond: 1
  sfhp: nosh
  step: 3
  size: 20.67
  temperature: 300
  excess: 5.0e-4
