# Variable-cell relaxation on the engine family whose tensor arrives through a
# Turbomole record rather than an engine keyword.
#
# Run: pyrai3md optimize_cell_xtb.yaml
#
# Same request as `optimize_cell_cp2k.yaml` and the same ethylene-in-a-10-A box,
# one ground state: xtb declares `stress: hartree/bohr^3` in its manifest and
# `supports_pbc: true`, and a step answers with one engine call instead of the
# six the strain route pays. What the tensor is read out of is the difference
# worth pairing: the LAMMPS vehicle (`optimize_cell_lammps.yaml`) supplies it as
# a pressure block, and this one supplies the lattice gradient `gradlatt`, which
# the skill converts with `G.T @ H / det(H)` (dev/skills/STRESS_DEVELOPMENT.md
# section 3.2).
#
# The method is GFN-FF and that is the engine's doing, not a preference. Round
# tmp_20261015_211219 ran this case on GFN2-xTB and the SCF stopped at
# `scf: Multipoles not available with PBC`; on the same box, probed directly
# against xtb 6.7.1 on the test environment, `--gfn 1 --grad` completes and
# writes `gradlatt`, but its lattice-gradient rows are nine exact zeros
# (`|dE/dlatt| =  0.000000`) while GFN-FF writes `|dE/dlatt| =  0.008680` with a
# nonzero block. A periodic cell run therefore has one producer here, and the
# parser refuses to read an unwritten gradient as a zero-stress box
# (xtb_skill/tests/test_output_parser.py).
#
# Cost is NOT measured on this environment: xtb is not installed here, so the round
# gives the first reading. maxit stops at 4 for that reason.

control:
  title: optimize_cell_xtb_example
  jobtype: optimize
  theory: [xtb]

atoms: [C, C, H, H, H, H]
coordinates:
  - [-1.120191050, 0.000000000, -2.661941306]
  - [-1.120191050, 0.000000000, -1.331783306]
  - [-1.120191050, 0.923341000, -3.234891306]
  - [-1.120191050, -0.923341000, -3.234891306]
  - [-2.043532050, 0.000000000, -0.758833306]
  - [-0.196850050, 0.000000000, -0.758833306]

molecule:
  charges: 0
  multiplicity: 1
  pbc: [1, 1, 1]
  cell: [10.0, 10.0, 10.0, 90.0, 90.0, 90.0]
optimize:
  method: minima
  maxit: 4
  opt_energy: 1.0e-4
  opt_grms: 1.0e-3
  opt_gmax: 2.0e-3
  opt_drms: 2.0e-3
  opt_dmax: 4.0e-3
  optimize_cell: true

xtb:
  method: gfn_ff
  profile: gfn_ff_gradient
  charge: 0
  uhf: 0
  execution_mode: local
