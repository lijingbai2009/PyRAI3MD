# Geometry optimization using MinimaOptimizer (BFGS + RFO + Trust Radius)
# Topology: Dispatcher local / Workflow iterative / Calculator local
# Run: pyrai3md optimize_minima.yaml

control:
  title: optimize_minima_example
  jobtype: optimize
  theory: [pyscf]

optimize:
  method: minima
  maxit: 100
  opt_energy: 1e-6
  opt_grms: 3e-4
  opt_gmax: 4.5e-4
  opt_drms: 1.2e-3
  opt_dmax: 1.8e-3

atoms: [C, C, H, H, H, H]
coordinates:
  - [-2.268212933,  0.000000000, -2.898503391]
  - [-2.268212933,  0.000000000, -1.568345391]
  - [-2.268212933,  0.923341000, -3.471453391]
  - [-2.268212933, -0.923341000, -3.471453391]
  - [-2.810939156,  0.746998561, -0.995395391]
  - [-2.810939156, -0.746998561, -0.995395391]

molecule:
  charges: 0
  multiplicity: 1
  ci: [1]
  spin: [0]

pyscf:
  method: hf
  basis: sto3g
  scratch_path: ./scratch
