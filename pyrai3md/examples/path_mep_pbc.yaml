# Minimum energy path in a periodic cell, on a force field
# Topology: Dispatcher local / Workflow iterative (path, walker) / Calculator local
# Run: pyrai3md path_mep_pbc.yaml
#
# Fixtures: h2o.data + h2o.in.init + h2o.in.settings (the shipped 60-atom TIP3P box)
#
# The fixed-cell arm of the path family: the walk's distances are the nearest
# periodic images, each frame is written with the extended-XYZ cell comment, and
# the probe the backend evaluates is the one the walker adopted back out of the
# state after the wrap. The start is one water pulled 0.35/0.25 A off its
# minimum, so the walk has a gradient to leave on.
#
# `path_radius: 0.05` is a reading, not a default. The box is strained, and on
# it a 0.1 Bohr shell takes a first step that raises the energy by 0.31 Hartree
# - the walk then spends its probe budget coming back and accepts no point at
# all. At 0.05 it accepts four points down a monotone profile
# (-0.2816 -> -0.3864 Hartree over 0.20 Bohr of arc) and at 0.01 the same walk
# is still monotone but covers a fifth of that. The earlier 0.1 was measured
# against a seed one box off the geometry the run evaluated (the defect
# `pathbase.py::_continuous_atoms` closes), so the shell it was tuned on was
# not the one this walk is on.
#
# What it needs from the host: LAMMPS (the shipped force field, read by project
# name from the launch directory).
control:
  title: path_mep_pbc
  jobtype: optimize
  theory: [lammps]
  driver: main

optimize:
  method: mep
  maxit: 4
  path_radius: 0.05
  path_inner_maxit: 10
  path_constraint: sphere
  opt_grms: 1.0e-3
  opt_gmax: 2.0e-3

atoms: [O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H]
