  charges: 0
  multiplicity: 1
  pbc: [1, 1, 1]
  cell: [10.5, 10.5, 10.5, 90.0, 90.0, 90.0]

optimize:
  method: minima
  maxit: 5
  opt_energy: 1.0e-4
  opt_grms: 1.0e-3
  opt_gmax: 2.0e-3
  opt_drms: 2.0e-3
  opt_dmax: 4.0e-3
  optimize_cell: true
  # Named rather than inherited; see the header.
  opt_cell_coupling: anisotropic

xtb:
  method: gfn_ff
  profile: gfn_ff_gradient
  charge: 0
  uhf: 0
  execution_mode: local
