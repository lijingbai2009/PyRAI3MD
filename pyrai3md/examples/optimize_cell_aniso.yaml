# Variable-cell relaxation with all six lattice components free, and the one
# cell example that says which coupling it means instead of inheriting it.
#
# Run: pyrai3md optimize_cell_aniso.yaml
#
# `anisotropic` is the default (schema/config.py:193, data/core.py:539,
# workflow/optimize.py:195) and every other cell case has been running it
# without naming it; the only example that stated its coupling was the one that
# asked for the other half, `optimize_cell_pressure.yaml`. Writing the key here
# is what makes the pair of readings complete rather than implied.
#
# What the run has to show, and what it would mean if it did not: the three
# lattice row lengths change their RATIOS. Under isotropic coupling every
# component moves along one unit vector built from the row lengths
# (optimizer/base.py::_cell_direction, :757-780), so the ratios are pinned by
# construction; under anisotropic coupling that function returns None and the
# step is never projected onto that direction. A box whose ratios came out
# identical would therefore not be a slow relaxation - it would be the
# projection being applied where it must not be.
# The system is one ethylene inside 25 waters in a 10.5 A cube, 81 atoms, and it
# is a built structure rather than a hand-written one: Packmol 21.2.1 placed it
# with a 2.3 A intermolecular exclusion under its periodic constraint, the
# ethylene pinned at the cell centre. Readings taken off the finished box with
# this package's own perception (utilities/image_flags.py::bond_graph, minimum
# image, periodic): 26 connected components, so every molecule is whole; closest
# intermolecular contact 2.518 A; nothing under a non-bonded floor once bonded
# and 1-3 pairs are excluded; density 0.654 g/cm3. That edge is what the audit
# asked for: cropping the same composition out of the equilibrated 525-water box
# gave 81 atoms but 0.54 g/cm3, because a sphere cut from a periodic box always
# leaves its corners empty and its cluster presses on its own image.
#
# Cost is NOT measured on this environment: xtb is not installed here, so the round
# gives the first reading.
control:
  title: optimize_cell_aniso_example
  jobtype: optimize
  theory: [xtb]

atoms: [C, C, H, H, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H]
