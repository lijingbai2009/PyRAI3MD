molecule:
  charges: 0
  multiplicity: 1
  pbc: [1, 1, 1]
  cell: [10.5, 10.5, 10.5, 90.0, 90.0, 90.0]

optimize:
  method: minima
  maxit: 5
  opt_energy: 1.0e-4
  opt_grms: 1.0e-3
  opt_gmax: 2.0e-3
  opt_drms: 2.0e-3
  opt_dmax: 4.0e-3
  optimize_cell: true
  # The shape is free, and this time there is something for it to relieve:
  # 1 kbar, read in bar and converted with the same helper the NPT barostats use,
  # on the tensile-positive sign convention they share, so the lattice is at rest
  # where sigma equals -p I rather than where it vanishes.
  opt_cell_coupling: anisotropic
  opt_pressure: 1700.0

xtb:
  method: gfn_ff
  profile: gfn_ff_gradient
  charge: 0
  uhf: 0
  execution_mode: local
