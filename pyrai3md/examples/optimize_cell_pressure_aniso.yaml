# Variable-cell relaxation under an applied pressure with all six lattice
# components free: the reading the other two cell cases leave implied.
#
# Run: pyrai3md optimize_cell_pressure_aniso.yaml
#
# `optimize_cell_pressure.yaml` asks 1 kbar of a shape-preserving box;
# `optimize_cell_aniso.yaml` lets the box change shape at zero pressure. Neither
# says what a pressure does to the SHAPE, and that is the whole of this case. It
# reuses the built box the aniso case is written on (one ethylene inside 25 waters
# in a 10.5 A cube, 81 atoms, Packmol 21.2.1 with a 2.3 A intermolecular exclusion,
# 26 connected components, closest intermolecular contact 2.518 A, density
# 0.654 g/cm3), the same engine (GFN-FF, the only periodic stress producer xtb
# 6.7.1 has) and one new factor, `opt_pressure`.
#
# Why this is not already covered by the pressure case, in the reporting layer:
# under `isotropic` the framework overwrites BOTH `Cell Stress RMS` and `Cell
# Stress Max` with the mean normal stress (optimizer/base.py:533-546), because a
# shape-preserving step has no direction that would relieve a deviatoric or shear
# residual and judging those would hold the run to a threshold it cannot reach.
# Under `anisotropic` those two rows stay what the six components of `sigma + p I`
# make them: an rms and a maximum over all six, off-diagonal terms included. So
# the off-diagonal part of the pressure residual gets judged here for the first
# time in this package's example set. The four asks of #371 stand, with the
# second one rewritten by #391 after this file's first round falsified its old
# wording: the keyword reached the search, and the box moved TOWARD its rest
# point (the residual of `sigma + p I` has to come down from the first recorded
# step to the last, and against a zero-pressure twin of the same box the load
# has to leave a smaller drift than the box makes unloaded). Asks 3 and 4 - the
# endpoint under the declared pair, and the run's own `Converged` line - are
# printed against those thresholds and not judged by them, by the ruling of
# 2026-10-19 that keeps this file a functional test at `maxit` 5; the two
# measurements behind that ruling are written out in
# `optimize_cell_pressure.yaml`, whose carrier this case shares.
#
# This file declares NO `opt_csrms` / `opt_csmax`. The schema default (40 / 60
# bar, schema/config.py:178-179) decides, because a new case is not given a
# looser threshold before it has been measured; the 100/100 pair belongs to the
# isotropic case by the user's ruling of 2026-10-18 and is not inherited here.
# `maxit` is 5, the budget every shipped example is held to.
#
# What the first round measured (`tmp_20261018_200317`, both carriers bit
# identical): volume 1157.625 -> 1173.355721 A^3, so this box GREW by 15.730721
# A^3 under 1 kbar; the residual of `sigma + p I` fell from 8286.1 bar at the
# first recorded step to 1669.8 bar (rms) / 2370.3 bar (max) at the last, against
# the schema's 40 / 60; the row-length ratios moved 5.959e-04, which is the
# anisotropic side of the #383 floor; `Converged: False`, so the leg reports not
# converged.
#
# Growing was not a sign error, and making that readable is why this case exists.
# The same box with no load on it - `optimize_cell_aniso`, the zero-pressure twin
# the judge pairs against - drifted 17.087668 A^3, so the load took 1.36 A^3 off
# the box's own expansion: the enthalpy term opposes the natural motion exactly as
# it should, while the ask-2 wording this file first shipped with ("a positive
# pressure that grew the box is a sign error") would have called a correct run
# wrong. #391 replaced that wording with the two numbers above.
#
# The load asks 1700 bar rather than 1 kbar, because this box's own residual
# stress at the end of its zero-pressure relaxation measures |sigma| = 1688.097
# bar of compression (`optimize_cell_aniso` on round `tmp_20261019_122659`, the
# last of its five recorded steps) and `sigma = -p I` sits there.
#
# That round is also the first reading of this file at 1700 bar, and it is the
# reply to the paragraph above about growing. Volume 1157.625 -> 1172.3730 A^3,
# a drift of 14.748035 A^3, against the 17.087668 A^3 the same box makes with no
# load on it: the load took 2.339633 A^3 off the box's own expansion. The
# residual fell on both rows - 7800.131 -> 1817.053 bar rms, 11522.058 ->
# 2555.059 bar max - so the off-diagonal part is coming down with the diagonal
# part rather than being left behind, which is the reading only this coupling
# can give. It ended above the schema's 40 / 60 and `Converged: False`, and
# under the ruling above those two are printed, not judged; ask 1 and ask 2 both
# hold, so the leg reads pass.
#
# Cost in the test environment is a round reading; xtb is not installed on this environment.
control:
  title: optimize_cell_pressure_aniso_example
  jobtype: optimize
  theory: [xtb]

atoms: [C, C, H, H, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H]
