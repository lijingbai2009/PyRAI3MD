  adaptive_udd_potential_local: false
  adaptive_gap_cv_local: false
  adaptive_gap_paper_local: false
  adaptive_md_max_local: false
  # maxmae carrier: the shipped reference band is narrowed by half, so the
  # round's five labels are outliers; the gate removes the worst one,
  # refits into NN-<title>-iter-2-r1 and passes on 0.0082 eV.
  adaptive_quality_gate_local: false
  adaptive_checks_nosh_local: false
energy:
  # Velocity Verlet's bounded oscillation at the example's own step:
  # measured 1.732e-3 on both the resident and subprocess paths (500-step
  # TIP3P NVE, 2026-11-08) and 1.401e-3 over 2000 steps. The failure this
  # sentinel exists for is an order larger (7.0e-2 mis-assigned reference,
  # 5.6e-2 zero gradient, 8.8e-3 leak), so 5e-3 keeps it with ~2.9x margin.
  etot_drift: 0.005
  etot_drift_rate: 1.0e-05
# Tolerances judging the variable-cell (NPT) examples on what their box
# did. volume_drift is max |V/V0 - 1| over the recorded cell frames,
# temperature_drift is max |T_inst/T_target - 1| (first frame excluded,
# which is the driven transient), cell_rotation_rad is the accumulated
# turn of the simulation frame. These are test-side thresholds: they say
# which runs are worth reading, not which physics is correct.
#
# The numbers are the gap in tmp_20260929_091941. volume_drift 0.25 is
# kept because it is the only one that ever caught a run that passed while
# sick (nh_mttk 0.575 in tmp_20260928_223009), and the healthiest finished
# run of this round reaches 0.159. temperature_drift went 1.0 -> 3.0 after
# this round failed two berendsen examples at 1.754/1.741 on boxes within
# 16% of where they started: a cell doing work on the particles heats them,
# which is ensemble behaviour, not a code hole. What a code hole looks
# like is the same round's csvr_pr at 3.1e6 K, and 3.0 still fails it.
box:
  volume_drift: 0.25
  temperature_drift: 3.0
# Below the failure thresholds but high enough to state in the record.
# cell_rotation_rad is 0.15 because the healthy examples already turn
# 0.062-0.070 rad over 2 ps (5.7e-5 rad per step does not cancel), so a
# tighter note would fire on every NPT run and stop meaning anything.
box_notes:
  volume_drift: 0.10
  temperature_drift: 0.5
  cell_rotation_rad: 0.15

