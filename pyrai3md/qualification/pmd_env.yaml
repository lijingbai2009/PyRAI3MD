  # this machine; Slurm variants hand MD/reference/training to the
  # cluster and are opened only in a remote round.

skills:
  openqp_skill:
    openqp_nproc: 2
    openqp_path: /public/software/app/openqp-1.3
    openqp_project: OPENQP
    execution_mode: local
    shell:
    - export GCC_LIB=/public/software/compiler/gcc-11.3.0/lib64
    - export MKL_LIB=/public/software/compiler/intel/oneapi/mkl/2025.2/lib/intel64/
