  # so a small spawn pool shortens a full round's startup. 0 = auto
  # (at most 8, never more than the host has), 1 = serial. This changes
  # only how fast the plan is built, not what it contains or how tests
  # execute.
  planning_workers: 0
  # How many grouped jobs a slurm round keeps submitted and unfinished
  # before it stops submitting more. 0 (the default) submits the whole
  # round at once and lets the scheduler queue it; N > 0 holds the rest
  # locally and tops the in-flight count back up to N as jobs finish.
  max_in_flight: 0
