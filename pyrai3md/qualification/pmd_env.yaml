# Per-test execution timeout in seconds. The runner's subprocess uses
# this value as its backstop; every generated execution script embeds
# `timeout (_timeout - 5)s` so the script kills the engine process group
# just before the backstop, leaving no residual processes. deploy's polling
# idle timeout is its own base (300s) plus this budget.
#
# Measured on the deployment, from the run's own PyRAI3MD End line: the
# longest LAMMPS example (md_lammps_nve, 2000 steps at 1 fs, direct 1 /
# buffer 100) finishes in 12 s of wall time, at the 4.20 ms per step
# framework time #244 measured. Against this 1200 s backstop that is a
# factor of a hundred.
#
# What that means in one sentence, because it is a decision and not an
# oversight: an example that silently falls back to the subprocess path
# costs 950 ms per step, so the same 2000-step run needs ~1900 s and is
# stopped at 1195 s rather than grinding past the backstop. A run whose
# resident service did not come up should report a timeout, not pass on a
# timetable nothing planned for.
#
# This is the only budget. The per-example `_example_timeout` map was
# removed on 2026-10-20: it existed for `optimize_cell_gap_cp2k`, the
# thirteen-call CP2K strain step, and round tmp_20261019_200652 measured
# both of that example's legs inside this backstop (735 s and 728 s, 61%
# of 1200 s) once the two workers each cp2k file now declares were in use.
# Every example answers to `_timeout`; a future case that genuinely needs
# more room gets the number raised here, with the measurement that asks
# for it, rather than a second table.
#
# Raised 2026-11-05 for the four single-center multi-step periodic legs
# (`multiscale_qmmm_{embedding,no_embedding}_md`, `_mep`, `_neb`), which this
# round opens as the regression arm for the deployment build's periodic resident
# session (#452 found the cause, #457 the readings). The reading that asks for it is round 18's
# own note on those two MD legs - "the two 20-min MD legs", i.e. ~1200 s, the
# whole of the previous budget - together with `multicenter_qmmm_num_freq`
# taking 18:39 of 1200 s in round `tmp_20261104_124614`. At 1200 s those legs
# would report a timeout rather than a physics verdict.
_timeout: 2400
# The master switch, three values:
#   true       - every example, skill case and benchmark calibration runs,
#                and the integration tests open whatever test_integration says
#   false      - none of the switched work runs; the verification unit tests
#                keep running, while the integration tests close with it
#   condition  - the family switches and the per-test switches decide
# The master is consulted above the family switches, so `false` closes a
# family even when its own key reads `true`: an optimize round is
# `_runall: condition` plus `examples.optimize_test: true`, never `false`.
#_runall: condition
_runall: true
# Integration tests: the cross-mode / all-shipped-example checks in
# qualification/integration/. They are not unit tests and are skipped by
# default; true runs them, false skips them (a folded row names this key).
# `_runall` sits above this switch: true forces integration on, false off,
# condition lets this key answer. The verification unit suite always runs.
test_integration: true
_prompts:
  conda_asked: true
