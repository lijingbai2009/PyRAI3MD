  nn_pes_skill:
    execution_mode: local
    # The shared machine-learning block. These are the &NN keywords,
    # spelled exactly as the classic input, the yaml example and the agent
    # config spell them, so a host default set here is a keyword an input
    # file can also write.
    #
    # modeldir holds one folder per ensemble ('energy_grad', 'nac'), and a
    # serving run reads a folder a 'train' run wrote. The paths are left
    # empty on purpose: they name a machine, not a calculation, and a
    # run that needs a trained surface says so in its own input.
    modeldir: ''
    train_data: ''
    # The test set a 'prediction' run measures the trained surface
    # against, read by the same rules as train_data. Empty like the two
    # paths above: it names a file on a machine, not a calculation.
    pred_data: ''
    train_mode: training
    # A training file carries Hartree energies and Hartree/Bohr gradients
    # and couplings, the framework's own convention. There is no unit keyword:
    # the only rule a file has to satisfy is that its energy and its gradient
    # describe one surface, and the trainer enforces that.
    # Ensemble size. This is what decides how many member groups of a
    # hyperparameter are read: fewer broadcast, surplus are ignored.
    mult_nn: 2
    nstate: 2
    # Device index per training subprocess. ';' separates the ensemble
    # members and one value broadcasts to all of them, exactly as a
    # hyperparameter does; -1 asks for no device, which is what a CPU-only
    # host has. This is a device list, not the original project's mode number.
    gpu: '-1'
    predict_batch_size: 64
    # The role sections carry the per-member hyperparameters of one
    # network family and are left to the container's own defaults here.
    # An input file writes them either as its own block
    #
    #   &EG
    #   depth        3
    #   epo          2000;1500
    #   loss_weights 1 1;1 10
    #
    # or, in a yaml, nested under the nn section:
    #
    #   nn:
    #     eg:
    #       depth: 3
    #       epo: '2000;1500'
    #
    # ';' is the ensemble member in every spelling; a keyword written once
    # serves both members. The three blocks name the three ensembles: 'eg'
    # fits energies and gradients, 'nac' the couplings, and 'soc' the
    # spin-orbit values, which the energy family serves as scalars in cm-1.
    eg: {}
    nac: {}
    soc: {}
    # Off for the optimize round. It was on for the certification run: this
    # skill needs the optional neural network extra (tensorflow>=2.20), and a
    # machine without it surfaces as a diagnostic skip naming the requirement,
    # never as a pass. What closing it buys is only that the round spends
    # nothing on the training route; it no longer hides the readings. #359 put
    # the pytest phase behind `runtime_tests` alone, so the files below are
    # still planned and run with `test: false` -- including the nn ones, whose
    # numeric cases train a model on the fly inside pytest.
    test: false   # round 11 green; round 12 retries the orca fixtures only
    # The pytest scripts shipped in tests/, planned whether or not `test` is
    # open (certification/planner.py reads this key and nothing else for that
    # phase). The TensorFlow-free contract tests always pass; the numeric ones
    # skip with a named reason on a host without the extra. `false` here closes
    # them and lists each as a skipped task naming this key.
    runtime_tests: false
    # One switch per test case YAML, keyed by its file stem. The cases run in
    # name order out of one shared directory, so the number in a stem is the
    # role it plays: 00/02/04 fit an ensemble, 01/03/05 serve that folder,
    # and 06 serves it by jobtype ('prediction') rather than by profile name.
    tests:
      00_mlp_eg_train: false
      01_mlp_eg_gradient: false
      02_mlp_nac2_train: false
      03_mlp_nac2_nac: false
      04_mlp_e_soc_train: false
      05_mlp_e_soc: false
      06_mlp_eg_predict: false
# Framework-level Slurm directives: what a dispatched child runtime asks the
# cluster for. Read by kernel/environment.Environment.get_slurm, frozen onto
# the run as state.pmd.environment.slurm, and written into the child's
# slurm.sh by workflow/dispatch/slurm_run. Not the skills' own slurm_*
# keywords, which belong to each skill's self-submission path.
# An input may restate any of these keys in its own top-level `slurm:` block
# (or the classic `&SLURM` section); the merge is per key, so a run that pins
# only `time` keeps the rest of this section. The merge is for that run
# alone.
# A key left '' writes no directive, and `exclusive: false` writes none
# either: the classic text states it as `exclusive false`, which is read back
# as false rather than as a non-empty string.
slurm:
  account: ''
  array: ''
  constraint: ''
  cpus_per_task: 1
  error: slurm-%j.err
  exclusive: false
  extra: ''
  gres: ''
  job_name: pyrai3md
  mail_type: ''
  mail_user: ''
  # Per grouped job. The local-pool adaptive examples hold five TensorFlow
  # workers plus their LAMMPS services; 5G hit the cgroup ceiling
  # (max_usage 5.37 GB, oom_kill 1) in round tmp_20261111_103921 and the
  # resident service died, so the job waited forever for the next force.
  mem: 16G
  mem_per_cpu: ''
  nodes: 1
  # Slots per grouped job. The local-pool adaptive examples run five
  # concurrent trajectories with two LAMMPS ranks each (md_multipool 5 x
  # lammps_nproc 2), so a one-slot allocation made their resident service
  # fail on "not enough slots" in round tmp_20261111_101848; 10 covers
  # that pool and cp2k's four ranks.
  ntasks: 10
  output: slurm-%j.out
  # Accepted partition list, in preference order: Slurm places each job on
  # whichever of these has room. `express` caps wall time at 24 h, well above
  # the 3 h job limit here.
  partition: long,short,express
  qos: ''
  # Per grouped job. With one job per carrier leg and per example
  # carrier, the longest measured task is cp2k dft_stress_num at 939 s
  # (round tmp_20261110_093321); an hour leaves room for a chain's few
  # short tasks.
  time: '1:00:00'
