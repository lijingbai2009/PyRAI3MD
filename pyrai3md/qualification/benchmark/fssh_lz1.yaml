# =====================================================================
# Dedicated FSSH benchmark case for the textbook Landau-Zener linear
# crossing model (flat benchmark layout: served by the
# benchmark/fssh.py task module; the dedicated name fssh_lz1.yaml
# takes precedence over the unified fssh.yaml whenever the pmd_env
# entry selects method lz1).
#
# Why lz1 and not a Tully model: the lz family shares the physical
# setup of the gsh_lz1 calibration verbatim (identical initial
# conditions and model parameters), so the two surface-hopping
# algorithms are compared on the same problem. The Landau-Zener
# model satisfies the premises of the analytic single-passage
# hopping statistics exactly:
#
#   V11 =  lz_a * x,   V22 = -lz_a * x,   V12 = lz_b (constant)
#   dH/dx = [[lz_a, 0], [0, -lz_a]]       (constant slopes)
#
# and the single-passage Landau-Zener probability
# P = exp(-pi * lz_b^2 / (lz_a * v_c)) (v_c from energy conservation
# on the lower adiabatic surface) is the calibration target of the
# trajectory Bernoulli statistic.
#
# Parameter set (middle-probability case, dt = 20 au fixed),
# identical to gsh_lz1:
#
#   lz_a = 0.2712 H/Bohr, lz_b = 0.0543 H (2*lz_b = 2.95 eV),
#   x0 = -5 Bohr, v0 = 0.0498 Bohr/au, model_mass = 2000 au,
#   nstep = 45.
#
# The crossing-point velocity v_c ~ 0.035 Bohr/au gives the
# single-passage Landau-Zener probability P ~ 0.38. The gap
# threshold is pinned to 3.5 eV, above the gap minimum
# 2*lz_b = 2.95 eV, so the crossing passes the md gap gate. nstep
# bounds the post-crossing run-away on the descending linear
# surface so the ensemble stays inside the fixed reference grid
# window [-30, +80] Bohr (final x ~ 77 Bohr).
#
# The fssh-specific pins follow the unified fssh.yaml verdicts:
# deco = '0.1' (decoherence decay collapses the never-hopping
# trajectories into pure 0/1 final states, keeping the ensemble
# average a Bernoulli hop statistic) and rk4 = '1' (forward Euler
# diverges on the coherence rotation at the 2.95 eV gap);
# nactype = nac keeps the exact qdm transition gradients.
#
# Metrics: the unified final-state metric set judges the final
# state population against the wavepacket reference
# (state_reference_difference) and the analytic single-passage
# Landau-Zener probability (state_analytical_difference): the
# steep linear slopes make the exact wavepacket reference re-cross
# the interaction region on a period shorter than the observation
# window (multi-passage oscillations the single-passage hopping
# model is not designed to reproduce), so the analytic comparison
# target anchors the verdict. FSSH carries no kernel replay, so the
# internal hopping probability of the gsh/lzsh lz cases is not
# computed here.
#
# Sep 2 2026
# By Jingbai Li
# Hoffmann Institute of Advanced Materials, Shenzhen Polytechnic Univ.
# =====================================================================

case: fssh_lz1
description: >-
  Fewest-switches surface hopping calibration on the textbook
  Landau-Zener linear crossing model (constant diabatic slopes,
  constant coupling), shared physical setup with the gsh_lz1 case:
  the trajectory ensemble final population Bernoulli statistic is
  scored against the analytic single-passage Landau-Zener
  probability.

production:
  method: lz1            # Landau-Zener model (dedicated case file)
  lz_a: 0.2712           # diabatic slope (Hartree/Bohr); pinned
                         # here, forwarded into both the production
                         # and the reference qdm sections
  lz_b: 0.0543           # constant coupling (Hartree); gap minimum
                         # 2*lz_b = 2.95 eV
  ninitcond: 100         # standard benchmark: 100-trajectory ensemble
                         # (binomial noise of the final S1 fraction:
                         # sigma ~ 0.048 at p ~ 0.38)
  ncpus: 4               # multitask pool size for the trajectories
                         # (mapped to the md-section multipool keyword)
  deco: '0.1'            # decoherence correction (see fssh.yaml):
                         # collapses the residual coherence of the
                         # never-hopping trajectories into pure 0/1
                         # final states; pmd_env benchmark entries
                         # take priority over this template pin
  nstep: 45              # md steps per trajectory (T = 900 au; the
                         # descending linear far side accelerates the
                         # packet, the shorter window keeps the
                         # ensemble inside the reference grid)
  dt: 20                 # md time step (au, ~0.5 fs)
  substep: 500           # electronic substeps per md step (delt = dt/substep
                         # = 0.04 au): the RK4 coherence rotation is stable
                         # only for gap*delt <= ~2.83 Hartree and the linear
                         # LZ gap 2*lz_a*|x| is unbounded -- the schema
                         # default substep 20 (delt 1 au) diverges once the
                         # post-crossing runaway passes |x| ~ 5.2 Bohr and
                         # floods the population records with NaN; 500
                         # substeps keep gap*delt < 1.7 up to |x| ~ 130 Bohr
  sfhp: fssh
  rk4: '1'               # electronic density propagation by RK4
                         # (pinned, see fssh.yaml): forward Euler
                         # diverges on the coherence rotation at the
                         # 2.95 eV gap
  nactype: nac           # md-schema keyword: use the qdm transition
                         # gradients (exact NAC)
  gap: 3.5               # IC gap threshold (eV): explicitly pinned
                         # above the gap minimum 2*lz_b (2.95 eV) so
                         # the crossing passes the gap gate; the
                         # schema default 0.5 eV would reject it
  x0: -5                 # initial coordinate (Bohr); benchmark-only
                         # unit convention (regular inputs take
                         # Angstrom); phase-aligned so the crossing
                         # lands on the md time grid
  v0: 0.0498             # initial velocity (Bohr/au); the climb to
                         # the crossing leaves v_c ~ 0.035 giving
                         # P_LZ ~ 0.38
  sigma: 0.5             # packet width (Bohr)
  model_mass: 2000.0     # model mass (au)
  initial_state: 0       # initially populated adiabatic state

reference:
  ngrid: 4096            # split-operator grid points (fixed default
                         # window [-30, +80] Bohr); dx = 0.0269 Bohr
                         # keeps the packet momentum k0 = m*v0 ~ 100 au
                         # below the Nyquist bound pi/dx ~ 117 (2048
                         # aliases the momentum and reverses the
                         # reference propagation)
  substeps: 10           # inner reference steps per md step

metrics:
  # Unified final-state metric set: the judged differences compare
  # the ensemble-averaged final S1 population against the wavepacket
  # reference and the analytic single-passage Landau-Zener
  # probability.
  state_reference_difference:
    tolerance: 0.2070    # calibrated 2026-09-03: 110% of the observed
                         # deviation (0.1881)
  state_analytical_difference:
    tolerance: 0.0335    # calibrated 2026-09-03: 110% of the observed
                         # deviation (0.0304)
