name: pyscf
backend:
  module: backend
  class: PySCFBackend
# Molecular (non-periodic) backend: periodic runs are rejected by the
# skill validation instead of being silently ignored.
supports_pbc: false
units:
  energy: hartree
  gradient: hartree/bohr
roles:
  qm: PySCFBackend
  # This skill can hold both layers of a single-center composite: the two-layer
  # PySCF transition-state search shipped as `optimize_ts_multiscale.yaml` is
  # planned, dispatched and converged on the test environment (3 tasks per evaluation,
  # `qm`, `qm2`, `qm2_task1`). It used to say `false` here while the framework
  # resolved the second position anyway.
  qm2: PySCFBackend
  mm: false
capabilities:
- energy
- gradient
- frequency
- geometry_optimization
- ir_spectrum
- uv_spectrum
- nmr_spectrum
- analysis
# The names this skill's slurm runner writes (#3.8): the batch
# script suffix and the job log suffix, matched at the end of a
# file name. The qualification harness looks for these instead of
# spelling them itself.
slurm_artifacts:
  script: .sbatch
  log: _slurm.out
# Compute resources this skill consumes, named by the keywords a run
# sets them with (#306). Only a thread axis: this skill starts no MPI
# ranks, so one calculation is one process.
resources:
  # Keywords this skill reads and the values used when an input omits them
  threads:
    keyword: thread
    default: 1

profiles:
