version: 1.0
name: mrsf_nac_test

# NAC vector single point (runtype=nac, PES analysis, not MD):
# verifies the [nac] section (dt/dx/states/bp) with states taken from the
# first target_nac_pair, and that [properties]export produces the
# nac_<i>_<j> export file. OpenQP supports only one state pair per run on
# this driver.
#
# No worker count is declared: how many displaced structures run at once is
# set by `openqp_nproc` (MPI ranks) and `openqp_thread` (OpenMP per rank),
# neither of which reaches the deck. The former `nac_thread` key is refused
# by name (#426).

input:
  atoms: [C, C, H, H, H, H]
  coordinates:
    - [-1.120191050, 0.000000000, -2.661941306]
    - [-1.120191050, 0.000000000, -1.331783306]
    - [-1.120191050, 0.923341000, -3.234891306]
    - [-1.120191050, -0.923341000, -3.234891306]
    - [-2.043532050, 0.000000000, -0.758833306]
    - [-0.196850050, 0.000000000, -0.758833306]
  charges: 0
  multiplicity: 1
  nstate: 3
  state_spin: [0, 0, 0]
  profile: mrsf_nac
  method: mrsf
  basis: sto-3g
  functional: bhhlyp
  target_states: [0, 1]
  coupling: [[0, 1]]
  target_nac_pair: [[0, 1]]
  execution_mode: local

expected:
  energy:
    value: null
    shape: [3]
    tolerance: 1e-6
  nac:
    value: null
    shape: [1, 6, 3]
    tolerance: 1e-6
