version: 1.0
name: mrsf_soc_test

# Spin-orbit couplings without gradients (runtype=soc): OpenQP solves the
# singlet and triplet ladders from one triplet ROHF reference and couples
# them, publishing `energies_s`, `energies_t` and the `socme` table. The
# dedicated driver takes no gradient, so the deck carries no grad_s /
# grad_t selector either.
#
# Measured on OpenQP 1.3.1 with this deck (sto-3g, BHHLYP, Cartesian
# functions): socme holds 12 rows = 2 singlets x 2 triplets x 3 Ms, its
# (S,T,Ms) labels match the log's own singlet-triplet table row for row and
# its Absolute column agrees to 4.1e-13. Collapsing the three Ms components
# of each declared pair gives 0.0000 cm-1 for S0/T0 (symmetry-forbidden) and
# 8.6359 cm-1 for S1/T1, so the returned array is not all zeros.

input:
  atoms: [C, C, H, H, H, H]
  coordinates:
    - [-1.120191050, 0.000000000, -2.661941306]
    - [-1.120191050, 0.000000000, -1.331783306]
    - [-1.120191050, 0.923341000, -3.234891306]
    - [-1.120191050, -0.923341000, -3.234891306]
    - [-2.043532050, 0.000000000, -0.758833306]
    - [-0.196850050, 0.000000000, -0.758833306]
  charges: 0
  multiplicity: 1
  nstate: 4
  state_spin: [0, 0, 2, 2]
  coupling: [[0, 1], [0, 2], [1, 3]]
  profile: mrsf_soc
  method: mrsf
  basis: sto-3g
  functional: bhhlyp
  target_states: [0, 1]
  execution_mode: local

expected:
  energy:
    value: null
    shape: [4]
    tolerance: 1e-6
  soc:
    shape: [2]
