version: 1.0
name: qmmm_cluster_test

input:
  atoms:
    - O
    - H
    - H
    - O
    - H
    - H
  coordinates:
    - [1.00000000, 1.00000000, 1.00000000]
    - [2.00000000, 1.00000000, 1.00000000]
    - [1.00000000, 2.00000000, 1.00000000]
    - [5.00000000, 5.00000000, 5.00000000]
    - [6.00000000, 5.00000000, 5.00000000]
    - [5.00000000, 6.00000000, 5.00000000]
  charges: 0
  multiplicity: 1
  # Non-periodic cluster: boundary f f f, real-space Coulomb (no
  # kspace), so the in-cell Q-Q correction has a literal minimum image.
  pbc: [0, 0, 0]
  profile: qmmm_field
  method: ff
  execution_mode: local
  lammps_units: real
  lammps_shake: 0
  # Flow-1 probe: atoms 1-3 are the first water.
  qm_atoms: [0, 1, 2]

expected:
  energy:
    value: null
    tolerance: 1e-6
  gradient:
    shape: [1, 6, 3]
