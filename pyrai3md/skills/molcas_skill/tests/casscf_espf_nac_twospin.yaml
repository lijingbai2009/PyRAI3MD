version: 1.0
name: casscf_espf_nac_twospin_test

# The mixed-ladder two-pass deck: embedding plus a declared coupling, on a
# ladder that spans two spin manifolds. The generic builder splits the run into
# an ESPF pass and a field-free NAC pass, and #449 writes one `&ESPF` per
# manifold inside the first pass, clearing the ESP communication files between
# them. The deck is therefore four RASSCF jobs - `Spin=1`, `Spin=3` under their
# own `&ESPF`, then `Spin=1`, `Spin=3` for the couplings - where before the
# change the embedding pass built only the singlet manifold and the triplet
# embedded whatever density file the singlet pass had left behind.
#
# The background embedding is spelled the way the skill-test flow carries it:
# `external_charges` inline, which `_stage_charge_sidecar` writes out as
# `{project}.charge` with a `point angstrom external` declaration and replaces
# with `read_charge: true`. `point_charges` is the framework's whole-system
# channel and is not part of this flow - a case that spells it gets
# `embedding: true` with no charge source and the framework carriers refuse
# before the engine (measured in rounds 18-20).
#
# Both readers want the same ladder in their own spelling, so the file carries
# both: the framework sizes a center from `ci`/`spin` and validates `coupling`
# against that range, while the skill reads `state_spin`.

input:
  atoms: [C, C, H, H, H, H]
  coordinates:
    - [-1.120191050, 0.000000000, -2.661941306]
    - [-1.120191050, 0.000000000, -1.331783306]
    - [-1.120191050, 0.923341000, -3.234891306]
    - [-1.120191050, -0.923341000, -3.234891306]
    - [-2.043532050, 0.000000000, -0.758833306]
    - [-0.196850050, 0.000000000, -0.758833306]
  charges: 0
  multiplicity: 1
  nstate: 4
  state_spin: [0, 0, 2, 2]
  ci: [2, 2]
  spin: [0, 1]
  # One same-spin pair per manifold: the NAC pass answers both.
  coupling: [[0, 1], [2, 3]]
  jobtype: energy gradient nac
  profile: casscf_properties
  method: casscf
  basis: ano-s-mb
  nact_elec: 2
  nact_orb: 3
  inactive_orb: 6
  nocsf: true
  embedding: charge
  # [q, x, y, z] in e / Angstrom, neutral overall, 5 A away from the molecule:
  # charges on the nuclei fed a 1/r pole into the CI Hamiltonian and RASSCF died
  # with "Making explicit Hamiltonian failed" (round 19, rc=250).
  external_charges:
    - [1.0, 6.0, 0.0, 5.0]
    - [-1.0, -6.0, 0.0, -5.0]
  execution_mode: local

expected:
  energy:
    value: null
    tolerance: 1.0e-06
  nac:
    shape: [2, 6, 3]
