version: 1.0
name: dft_stress_num_test
# Numerical (external strain) stress of the same water box that
# dft_stress_test certifies analytically: the two runs differ only in
# stress_method, so their tensors can be compared element by element to
# fix the sign, the transpose, the central volume and the shear factor
# (dev/skills/cp2k_num_stress.md section 8, item 2).
#
# stress_scope and stress_delta are left unwritten here on purpose: the
# case exercises the declared defaults ('full', 1e-3) rather than
# pinning them, and the twelve perturbed points are what a full tensor
# costs.
input:
  atoms: [O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H, O, H, H]
  coordinates:
    - [1.575000000, 1.575000000, 1.575000000]
    - [2.331950327, 1.575000000, 2.160882277]
    - [0.818049673, 1.575000000, 2.160882277]
    - [1.575000000, 1.575000000, 4.725000000]
    - [2.331950327, 1.575000000, 5.310882277]
    - [0.818049673, 1.575000000, 5.310882277]
    - [1.575000000, 4.725000000, 1.575000000]
    - [2.331950327, 4.725000000, 2.160882277]
    - [0.818049673, 4.725000000, 2.160882277]
    - [1.575000000, 4.725000000, 4.725000000]
    - [2.331950327, 4.725000000, 5.310882277]
    - [0.818049673, 4.725000000, 5.310882277]
    - [4.725000000, 1.575000000, 1.575000000]
    - [5.481950327, 1.575000000, 2.160882277]
    - [3.968049673, 1.575000000, 2.160882277]
    - [4.725000000, 1.575000000, 4.725000000]
    - [5.481950327, 1.575000000, 5.310882277]
    - [3.968049673, 1.575000000, 5.310882277]
    - [4.725000000, 4.725000000, 1.575000000]
    - [5.481950327, 4.725000000, 2.160882277]
    - [3.968049673, 4.725000000, 2.160882277]
    - [4.725000000, 4.725000000, 4.725000000]
    - [5.481950327, 4.725000000, 5.310882277]
    - [3.968049673, 4.725000000, 5.310882277]
  lattice_vector:
    - [6.3, 0.0, 0.0]
    - [0.0, 6.3, 0.0]
    - [0.0, 0.0, 6.3]
  pbc: [1, 1, 1]
  charges: 0
  multiplicity: 1
  nstate: 1
  state_spin: [0]
  target_states: [0]
  profile: dft_gradient
  method: dft
  functional: pbe
  cutoff: 400
  ref_cutoff: 50
  stress: true
  stress_method: num
  # The strain pool: four workers for the twelve points, each a
  # cp2k_nproc-rank run, so the node budget is 4 x 4 ranks.
  multitask: true
  multipool: 4
  execution_mode: local

expected:
  energy:
    shape: [1]
  gradient:
    shape: [1, 24, 3]
  stress_tensor:
    shape: [1, 3, 3]
