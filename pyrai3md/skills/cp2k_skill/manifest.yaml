name: cp2k
backend:
  module: backend
  class: Cp2kBackend
# Periodic boundary support (read by query.get_metadata -> the
# framework capability gate and the skill validation). CP2K supports
# full 3D periodicity in this stage.
supports_pbc: true
units:
  energy: hartree
  gradient: hartree/bohr
  stress: gpa
roles:
  qm: Cp2kBackend
  qm2: false
  mm: false
capabilities:
- energy
- gradient
- stress
- transition_dipole
- geometry_optimization
- abinitio_dynamics
# The names this skill's slurm runner writes (#3.8): the batch
# script suffix and the job log suffix, matched at the end of a
# file name. The qualification harness looks for these instead of
# spelling them itself.
slurm_artifacts:
  script: .sbatch
  log: _slurm.out
# Compute resources this skill consumes, named by the keywords a run
# sets them with (#306). The framework reads this block instead of
# guessing a keyword: `threads` is what one rank may spread over,
# `ranks` how many ranks a calculation starts.
resources:
  # Keywords this skill reads and the values used when an input omits them
  threads:
    keyword: thread
    default: 1
  ranks:
    keyword: nproc
    default: 1

profiles:
  dft_energy:
    capability: energy
    method: dft
    steps:
    - energy
  dft_gradient:
    capability: gradient
    method: dft
    steps:
    - energy
    - gradient
  dft_opt_min:
    capability: geometry_optimization
    method: dft
    steps:
    - optimize
  dft_md:
    capability: abinitio_dynamics
    method: dft
    steps:
    - md
  tddft_energy:
    capability: energy
    method: tddft
    steps:
    - energy
    - tddft
  tddft_gradient:
    capability: gradient
    method: tddft
    steps:
    - energy
    - tddft
    - gradient
  tddft_transition_dipole:
    capability: transition_dipole
    method: tddft
    steps:
    - energy
    - tddft
    - transition_dipole
  tddft_opt_min:
    capability: geometry_optimization
    method: tddft
    steps:
    - tddft
    - optimize
  tddft_md:
    capability: abinitio_dynamics
    method: tddft
    steps:
    - tddft
    - md
